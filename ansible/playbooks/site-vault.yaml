---
# Vault 서버 한 대를 구성한다.
#
# site-prerequisites.yaml 과 분리한 이유는 롤 구성이 다르기 때문이다.
# Vault 노드는 K8s 노드가 아니라 containerd·kubeadm-common 이 필요 없다.
# 그쪽 플레이북의 hosts 패턴에서 !component_vault 로 빼두었다.
#
# **hosts 를 component_vault 로 잡는다.** platform_aws 로 잡으면 나중에 이
# 그룹에 들어올 컨트롤플레인·워커에도 Vault 가 깔린다.
#
# role 태그를 쓰지 않는 이유는 그것이 Kubernetes 노드 전용 라벨이기 때문이다
# (허용값 control-plane · service · devops · monitoring · messaging · logging).
# component 태그는 terraform/aws/vault 의 default_tags 가 "vault" 로 붙인다.
#
# ── 순서 ────────────────────────────────────────────────────────
#
# vpn-mesh 가 vault-server 보다 앞이다. Vault 의 TLS 도메인과 api_addr 이
# tailnet 이름에서 나오고, 접근 경로도 메시뿐이다.
#
# **egress 스택이 먼저 apply 돼 있어야 한다.** Private Subnet 이라 NAT 없이는
# apt 도 tailnet 조인도 나가지 못한다 — terraform/aws/vault/data.tf 의
# check 블록이 그것을 검사한다.
#
# ── 실행 ────────────────────────────────────────────────────────
#
#   export AWS_PROFILE=cntlp
#   export CNTLP_TAILSCALE_AUTH_KEY=tskey-auth-...     # ephemeral 로 발급한다
#   cd ansible
#   ansible-playbook -i inventories/aws/aws_ec2.yaml playbooks/site-vault.yaml \
#     -e vault_awskms_key_id=$(terraform -chdir=../terraform/aws/vault output -raw vault_kms_key_id)
#
# 이 플레이북은 Vault 를 **초기화하지 않는다.** `vault operator init` 은 사람이
# 한다 — references/20260801_infra-05-vault-ops.md
- name: Vault 서버 구성
  hosts: component_vault
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [os, common]
    - role: security-hardening
      tags: [os, security]
    - role: vpn-mesh
      tags: [mesh]
      vars:
        # Vault 는 K8s 노드가 아니므로 워커·컨트롤플레인 태그를 쓰지 않는다.
        # ACL 이 태그로 접근을 가른다 — tag:cntlp-vault 가 acls 에 없으면
        # 노드는 뜨는데 아무도 닿지 못하고, 접근 경로가 메시뿐이라 고립된다.
        #
        # 인벤토리 group_vars 가 아니라 여기 두는 이유는 이 호스트가
        # role_* 그룹에 안 들어가기 때문이다. component=vault 만 갖는다.
        tailscale_tags: "tag:cntlp-vault"

        # **롤 기본값과 같은 값이지만 일부러 남긴다.**
        #
        # 이 줄은 기본값이 false 이던 시절에 그걸 뒤집으려고 있었다. 지금은
        # 기본값이 true 라 없어도 같게 동작한다. 그래도 지우지 않는 이유는
        # 이 노드가 **없으면 죽는** 노드이기 때문이다 — vault-server 의 seal
        # 상태 검증이 자기 tailnet 이름을 풀어야 하고, api_addr 도 TLS
        # 도메인도 그 이름이다. 기본값이 다시 뒤집히면 조용히 깨진다.
        tailscale_accept_dns: true

        # **Tailscale SSH 는 이 노드에서만 끈다.** 롤 기본값은 켬이고, K8s
        # 노드 5대는 그걸로 접근 경로를 하나로 모았다
        # (tasks/todo/009_node-access-paths.md). Vault 는 거기 끼우지 않는다.
        #
        # 켜면 tailnet ACL 하나가 시크릿 저장소의 셸까지 가르게 된다. 지금
        # Vault 접근은 API(8200)와 KMS auto-unseal 로 닫혀 있고, 셸이 필요한
        # 경우는 secret/ssh/cntlp-private 의 전용 키가 담당한다 — 경로가 둘로
        # 갈려 있는 것이 여기서는 의도다.
        #
        # 이 줄이 없으면 롤 기본값이 상속돼 **site-vault 를 돌리는 것만으로**
        # Vault 의 접근 태세가 바뀐다. 실물은 지금 꺼져 있다(2026-08-04 확인).
        # 켤지 말지는 Keycloak OIDC 전환과 함께 볼 별도 판정이다 → CONSTRAINTS.md
        tailscale_ssh: false
    - role: vault-server
      tags: [vault]
