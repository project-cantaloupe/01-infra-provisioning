# 온프렘 워커 접속 설정 (platform-onp 태그가 만든 platform_onp 그룹).
#
# community.general.proxmox 플러그인은 ansible_host 만 compose 로 채울 수 있고
# 계정·키는 채워주지 않는다. 여기가 없으면 ansible 이 **로컬 사용자 이름**으로
# 붙으려다 "Permission denied (publickey)" 로 죽는다.
# 명령줄에 -u/--private-key 를 넘기면 통과해버려서, 사람이 손으로 돌릴 때는
# 되는데 플레이북·CI 에서는 안 되는 형태로 숨는다.
#
# ~/.ssh/config 의 Host cntlp-onp-wk-* 블록도 여기선 안 걸린다.
# ansible 은 별칭이 아니라 compose 가 채운 IP 로 붙기 때문이다.

# cloud-init 이 만드는 계정. terraform 의 var.vm_username 과 같아야 한다
# (terraform/onp/variables.tf). 한쪽만 바꾸면 여기서 끊긴다.
ansible_user: ubuntu

# 프로젝트 전용 키. GitHub 키와 분리해 둔 것이라 ssh-agent 에 없을 수 있어
# 파일 경로를 직접 지정한다. 다른 경로에 뒀다면 CNTLP_SSH_KEY 로 덮는다.
ansible_ssh_private_key_file: "{{ lookup('env', 'CNTLP_SSH_KEY') | default('~/.ssh/cantaloupe_ed25519', true) }}"

# 워커는 cloud image 로 갓 만들어져 known_hosts 에 없다. VM 을 다시 만들면
# 호스트 키가 바뀌어 또 막힌다. 홈랩 사설망이라 검사를 끈다 —
# terraform 의 proxmox_insecure, 인벤토리의 validate_certs 와 같은 성격이다.
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# swap off, 커널 모듈, sysctl 은 전부 root 가 필요하다.
# cloud-init 이 sudo NOPASSWD 로 만들어 뒀다.
ansible_become: true
ansible_become_method: sudo

# tailnet 태그 — roles/vpn-mesh/defaults/main.yml 참고. 롤에는 기본값이 없다.
# 온프렘 호스트는 전부 워커다. 컨트롤플레인은 AWS 에만 있다.
#
# **role_* 그룹이 아니라 platform_onp 에 둔다.** Proxmox 태그는 key=value 를
# 못 써서 role 값이 인벤토리마다 다르게 들어올 수 있는데, 여기서는 어느 role 이든
# 워커라서 platform 단위로 잡는 편이 덜 깨진다.
tailscale_tags: "tag:cntlp-wk"
