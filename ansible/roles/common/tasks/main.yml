---
# 세 영역의 노드가 공유하는 OS 준비. 영역별 분기를 두지 않는다.
#
# **순서가 의미를 갖는다.** 커널 모듈을 먼저 올려야 sysctl 키가 존재한다.
# br_netfilter 가 없는 상태에서 net.bridge.bridge-nf-call-iptables 를 쓰면
# "sysctl: cannot stat ... No such file or directory" 로 실패한다.
# 실제로 이 VM 에서 확인했다 — 모듈 미로드 상태에서 그 키가 없었다.

- name: Ubuntu 노드인지 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: 현재 공통 노드 준비 역할은 Ubuntu만 지원합니다.

- name: 커널 모듈을 부팅 시 올린다
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # kubeadm 요구사항. containerd 는 overlay, 파드 네트워킹은 br_netfilter 다.
      overlay
      br_netfilter

- name: 커널 모듈을 지금 올린다
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

# 위 모듈이 올라온 뒤라야 아래 키들이 존재한다.
- name: sysctl 을 넣는다
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # 파드 간 라우팅. 이게 0 이면 노드를 건너는 트래픽이 조용히 죽는다.
      net.ipv4.ip_forward = 1
      # 브리지를 지나는 트래픽도 iptables 를 타야 한다.
      # kube-proxy 와 Calico 의 NetworkPolicy 가 여기에 의존한다.
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  notify: Kubernetes sysctl 적용

# 롤이 끝날 때까지 미루지 않는다. kubeadm-worker 의 사전요건 검사가 이 값들이
# 이미 적용된 상태를 가정한다. security-hardening·containerd 도 같은 패턴을 쓴다.
- name: 핸들러를 지금 돌린다
  ansible.builtin.meta: flush_handlers

# kubelet 은 swap 이 켜져 있으면 뜨지 않는다 (--fail-swap-on 기본값 true).
# Ubuntu cloud image 는 기본적으로 swap 이 없지만, 없다고 가정하지 않는다.
- name: swap 을 끈다
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | default(0) | int > 0
  changed_when: true

- name: fstab 의 swap 항목을 주석 처리한다
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

# ── 시간 동기화 구현이 플랫폼마다 다르다 ───────────────────────
#
# 이 롤은 세 영역 공용이다. 그런데 NTP 구현이 이미지마다 다르다.
#
#   AWS·GCP Ubuntu AMI   chrony. 클라우드의 시간 서비스를 가리킨다
#                        (AWS 는 169.254.169.123). systemd-timesyncd 는 없다
#   Proxmox 클라우드 이미지  systemd-timesyncd
#
# 이름을 하나로 박아두면 다른 쪽에서
# "Could not find the requested service systemd-timesyncd" 로 죽는다.
# 그래서 있는 것을 찾아 켠다. 새로 깔지 않는다 — 이미지가 준 것을 쓰는 편이
# 클라우드 시간 서비스 설정을 그대로 유지한다.

- name: 어떤 NTP 유닛이 있는지 본다
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - --no-legend
      - chrony.service
      - systemd-timesyncd.service
  register: _ntp_units
  changed_when: false
  failed_when: false

- name: 쓸 유닛을 정한다
  ansible.builtin.set_fact:
    _ntp_unit: >-
      {{ 'chrony' if 'chrony.service' in _ntp_units.stdout
         else ('systemd-timesyncd' if 'systemd-timesyncd.service' in _ntp_units.stdout
               else '') }}

- name: NTP 구현이 하나도 없으면 멈춘다
  ansible.builtin.assert:
    that: _ntp_unit | length > 0
    fail_msg: >-
      chrony 도 systemd-timesyncd 도 없다. 노드 시계가 틀어지면 인증서 검증과
      etcd 리스가 깨지므로 시간 동기화 없이 진행하지 않는다.
      이미지를 확인한다 — 최소 설치 이미지라면 chrony 를 먼저 깐다.
    success_msg: "시간 동기화 유닛 — {{ _ntp_unit }}"

- name: 시간 동기화를 켠다
  ansible.builtin.systemd:
    name: "{{ _ntp_unit }}"
    enabled: true
    state: started

# 노드 시계가 틀어지면 인증서 검증과 etcd 리스가 깨진다.
- name: 시간이 실제로 동기화됐는지 확인한다
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: _ntp
  changed_when: false
  failed_when: _ntp.stdout | trim != "yes"

- name: 패키지를 깐다
  ansible.builtin.apt:
    name:
      # decisions/20260729_onprem-storage-allocation — Harbor blob 과 JENKINS_HOME 을
      # 호스트 NFS 에 둔다. kubelet 이 마운트하지만 mount.nfs 바이너리는 여기 있어야
      # 한다. 없으면 파드가 ContainerCreating 에서 "executable file not found" 로 멈춘다.
      - nfs-common
      # vpn-mesh·kubeadm-common 이 저장소 키를 받아 등록할 때 쓴다.
      - curl
      - gnupg
      - ca-certificates
      - apt-transport-https
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: swap 비활성 상태 확인
  ansible.builtin.command: swapon --show --noheadings
  register: swap_status
  changed_when: false
  failed_when: swap_status.stdout | trim | length > 0
