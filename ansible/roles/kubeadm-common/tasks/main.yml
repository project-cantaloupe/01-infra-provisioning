---
# ── 저장소 정의 충돌을 apt 보다 먼저 푼다 ────────────────────────
#
# **이 세 태스크는 아래 어떤 apt 태스크보다도 앞에 있어야 한다.**
# `/etc/apt/sources.list.d/` 안의 파일 하나가 깨지면 apt 는 그 파일만이
# 아니라 **소스 목록 전체를 못 읽는다**. 그러면 `ca-certificates` 를 까는
# 첫 태스크부터 죽어서, 정작 원인인 저장소 파일에는 손도 못 댄다.
#
# 실제로 2026-08-05 `cntlp-gcp-wk-01` 에서 이렇게 죽었다.
#
#   E: Conflicting values set for option Signed-By regarding source
#      https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /:
#      /etc/apt/keyrings/kubernetes-apt-keyring.gpg
#      != /etc/apt/keyrings/kubernetes-apt-keyring.asc
#   E: The list of sources could not be read.
#
# 저장소 URL 은 같은데 `signed-by` 만 다른 줄이 두 개였다. 손으로 깐 `.gpg`
# 줄 위에 롤이 `.asc` 줄을 덧붙인 결과다. **APT 는 한 저장소를 두 키로
# 검증하라는 지시를 모순으로 보고 거부한다.**
#
# 덧붙은 이유는 예전 `apt_repository` 모듈의 성질이다 — 그 모듈은 "이 줄이
# 없으면 추가"로 동작하므로, 같은 저장소를 가리키는 **다른 문자열**을
# 자기가 관리하는 줄로 인식하지 못한다. 그래서 아래에서는 `copy` 로 바꿔
# **파일 전체를 롤이 소유**한다. 관리 단위를 줄에서 파일로 올리면 이 부류의
# 충돌이 통째로 사라진다.
#
# 판정 → 판단 → 복구의 3단 구조는 security-hardening 의 ufw 고아 체인
# 복구와 같은 모양이다. `when:` 으로 막아서 정상 노드에서는 안 돈다.
- name: 기존 Kubernetes 저장소 정의 상태를 읽는다
  ansible.builtin.shell: |
    f=/etc/apt/sources.list.d/kubernetes.list
    if [ ! -f "$f" ]; then
      echo "lines: 0"
      echo "asc: 0"
      exit 0
    fi
    echo "lines: $(grep -c '^deb ' "$f" || true)"
    echo "asc: $(grep -c 'kubernetes-apt-keyring[.]asc' "$f" || true)"
  register: _k8s_repo_state
  changed_when: false
  check_mode: false

- name: 저장소 정의가 충돌하는지 판정한다
  ansible.builtin.set_fact:
    _k8s_repo_conflicting: >-
      {{ (_k8s_repo_state.stdout | from_yaml).lines | int > 1
         or (_k8s_repo_state.stdout | from_yaml).asc | int > 0 }}

# 지우고 아래에서 다시 만든다. 고치는 것이 아니라 버리는 이유는, 어떤
# 변종이 들어 있는지 미리 알 수 없기 때문이다. **아는 상태로 되돌리는 것이
# 모르는 상태를 고치는 것보다 싸다.**
- name: 충돌하는 저장소 정의를 치운다
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent
  when: _k8s_repo_conflicting | bool

- name: Kubernetes 저장소에 필요한 패키지 설치
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: APT keyring 디렉터리 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /var/cache/cntlp

# ── 서명 키는 바이너리 keyring(.gpg) 하나로 통일한다 ─────────────
#
# 같은 공개키를 담는 형식이 둘이다.
#
#   .asc   ASCII armored — `-----BEGIN PGP PUBLIC KEY BLOCK-----` 텍스트
#   .gpg   binary keyring — armored 를 `gpg --dearmor` 로 푼 것
#
# apt 2.4(Ubuntu 22.04) 이후로는 둘 다 읽으므로 기능 차이는 없다.
# **`.gpg` 를 고른 이유는 순전히 합류다** — kubernetes.io 공식 문서가
# `gpg --dearmor` 를 안내해서 손으로 깐 노드가 전부 `.gpg` 였고, 롤만
# `.asc` 를 쓰고 있었다. 형식이 갈리면 위의 Signed-By 충돌이 반복된다.
# 다수이자 문서와 같은 쪽으로 맞춘다. → 2026-08-06 결정
- name: Kubernetes 서명 키를 내려받는다 (armored 원본)
  ansible.builtin.get_url:
    url: >-
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version
      }}/deb/Release.key
    dest: /var/cache/cntlp/kubernetes-release.key
    owner: root
    group: root
    mode: "0644"
  register: _k8s_release_key

# 키가 갱신됐을 때만 치운다. 다음 태스크의 `creates:` 가 평소에는 변환을
# 건너뛰게 하므로, 이 두 개가 짝을 이뤄 **멱등하면서도 키 교체를 따라간다.**
# `creates:` 만 두면 키가 바뀌어도 영원히 옛 keyring 을 쓴다.
- name: 키가 갱신됐으면 옛 keyring 을 치운다
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: absent
  when: _k8s_release_key is changed

- name: 서명 키를 바이너리 keyring 으로 변환한다
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /var/cache/cntlp/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: keyring 권한을 맞춘다
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    owner: root
    group: root
    mode: "0644"

# **`apt_repository` 를 쓰지 않는다.** 위 주석의 이유로 파일 전체를 소유한다.
- name: Kubernetes APT 저장소를 확정한다
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: >
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /
    owner: root
    group: root
    mode: "0644"
  register: _k8s_repo_file

# 위 파일이 더 이상 참조하지 않게 된 뒤에 지운다. 순서를 바꾸면 잠깐이지만
# apt 가 없는 키를 가리키는 저장소를 보게 된다.
- name: 레거시 armored keyring 을 제거한다
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    state: absent

# `apt_repository` 가 해주던 일을 대신한다. 파일이 바뀌었을 때만 돈다.
- name: 저장소가 바뀌었으면 APT 캐시를 갱신한다
  ansible.builtin.apt:
    update_cache: true
  when: _k8s_repo_file is changed

- name: kubelet kubeadm kubectl 설치
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    allow_change_held_packages: true

- name: Kubernetes 패키지 자동 업그레이드 방지
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"

# kubeadm 실행 전 kubelet 재시작은 정상이며, 부트스트랩 후 정상 상태가 된다.
- name: kubelet 부팅 시 자동 시작 설정
  ansible.builtin.service:
    name: kubelet
    enabled: true

- name: 설치된 kubeadm 버전 확인
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_installed_version
  changed_when: false
  check_mode: false

- name: kubeadm 버전 일치 확인
  ansible.builtin.assert:
    that:
      - kubeadm_installed_version.stdout | trim == kubernetes_version
    fail_msg: >-
      설치된 kubeadm 버전이 클러스터 설정과 다릅니다.
      cluster.yml의 Kubernetes 버전을 함께 갱신하세요.
