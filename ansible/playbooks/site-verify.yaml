---
# 모든 대상 노드가 사용할 Tailscale 주소를 먼저 수집한다.
- name: Kubernetes 노드 네트워크 정보 수집
  hosts: role_control_plane:role_worker
  become: true
  gather_facts: true
  tasks:
    - name: Tailscale IPv4 조회
      ansible.builtin.command: tailscale ip -4
      register: verify_tailscale_ip
      changed_when: false
      check_mode: false

    - name: Tailscale IPv4 저장
      ansible.builtin.set_fact:
        tailscale_ipv4: "{{ verify_tailscale_ip.stdout | trim }}"

    - name: 노드 검증 변수 확인
      ansible.builtin.assert:
        that:
          - tailscale_ipv4
            is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - kubernetes_node_platform is defined
          - kubernetes_node_role is defined
        fail_msg: Tailscale 주소 또는 Kubernetes 노드 라벨 변수를 확인하세요.

# kubectl 명령은 단일 Control Plane에서 실행하고 클러스터 상태를 변경하지 않는다.
- name: Kubernetes 클러스터 상태 검증
  hosts: role_control_plane
  become: true
  gather_facts: false
  vars_files:
    - ../vars/cluster.yml
  vars:
    cluster_inventory_hosts: >-
      {{
        (groups['role_control_plane'] | default([]))
        + (groups['role_worker'] | default([]))
      }}
  tasks:
    - name: 클러스터의 모든 노드가 Ready인지 확인
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=5m
      changed_when: false
      check_mode: false

    - name: 클러스터 전체 노드와 라벨 조회
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - get
          - nodes
          - -o
          - json
      register: all_cluster_nodes
      changed_when: false
      check_mode: false

    - name: 전체 노드 명명 규칙과 필수 라벨 확인
      ansible.builtin.assert:
        that:
          - item.metadata.name
            is match('^cntlp-(aws|gcp|onp)-(cp|wk)-[0-9]{2}$')
          - item.metadata.labels.platform | default('')
            == item.metadata.name.split('-')[1]
          - item.metadata.labels.role | default('')
            == (
              'control-plane'
              if item.metadata.name.split('-')[2] == 'cp'
              else 'service'
            )
        fail_msg: >-
          {{ item.metadata.name }}의 이름 또는 platform/role 라벨이
          Cantaloupe 컨벤션과 다릅니다.
      loop: "{{ (all_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: not ansible_check_mode

    - name: 노드 InternalIP와 필수 라벨 조회
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - get
          - node
          - "{{ hostvars[item].ansible_facts.hostname }}"
          - '-o=jsonpath={.status.addresses[?(@.type=="InternalIP")].address}:{.metadata.labels.platform}:{.metadata.labels.role}'
      loop: "{{ cluster_inventory_hosts }}"
      register: cluster_node_contracts
      changed_when: false
      check_mode: false

    - name: 노드 InternalIP와 필수 라벨 일치 확인
      ansible.builtin.assert:
        that:
          - item.stdout | trim
            == hostvars[item.item].tailscale_ipv4
            ~ ':' ~ hostvars[item.item].kubernetes_node_platform
            ~ ':' ~ hostvars[item.item].kubernetes_node_role
        fail_msg: >-
          {{ hostvars[item.item].ansible_facts.hostname }}의 InternalIP 또는
          platform/role 라벨이 인벤토리와 다릅니다.
      loop: "{{ cluster_node_contracts.results }}"
      loop_control:
        label: "{{ hostvars[item.item].ansible_facts.hostname }}"

    - name: Calico 노드 네트워크 준비 상태 확인
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - -n
          - calico-system
          - rollout
          - status
          - daemonset/calico-node
          - --timeout=5m
      changed_when: false
      check_mode: false

    - name: CoreDNS 준비 상태 확인
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - -n
          - kube-system
          - rollout
          - status
          - deployment/coredns
          - --timeout=5m
      changed_when: false
      check_mode: false

    - name: 최종 노드 상태 조회
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - get
          - nodes
          - -L
          - platform,role
          - -o
          - wide
      register: cluster_nodes_summary
      changed_when: false
      check_mode: false

    - name: 최종 노드 상태 출력
      ansible.builtin.debug:
        var: cluster_nodes_summary.stdout_lines
