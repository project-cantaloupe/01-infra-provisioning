---
# AMI에 노드 고유 상태를 남기지 않는다. 이 정리가 빠지면 새 EC2들이 같은
# machine-id, SSH host key, Tailscale machine key를 공유하거나 이전 kubeadm
# 흔적을 물려받는다.

- name: Golden Image 전용 실행인지 확인
  ansible.builtin.assert:
    that:
      - not (tailscale_join | bool)
    fail_msg: Golden Image에서는 tailnet 가입을 비활성화해야 합니다.

- name: 부팅 시 필요한 서비스를 활성화하고 현재 빌드에서는 중지
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: stopped
  loop:
    - kubelet
    - containerd
    - tailscaled

- name: Kubernetes와 컨테이너 런타임의 노드 상태 제거
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /etc/cni/net.d
    - /var/lib/cni
    - /var/lib/calico
    - /var/lib/kubelet
    - /var/lib/containerd
    - /run/kubeadm-join.yaml

- name: Tailscale 장치 신원과 임시 인증 파일 제거
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/tailscale
    - /run/cntlp-tailscale-auth-key
  no_log: true

- name: SSH host key 목록 조회
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: ssh_host_*_key*
    file_type: file
  register: golden_image_ssh_host_keys

- name: SSH host key 제거
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ golden_image_ssh_host_keys.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: APT 캐시 제거
  ansible.builtin.command: apt-get clean
  changed_when: true

- name: systemd journal 회전
  ansible.builtin.command: journalctl --rotate
  changed_when: true

- name: 회전된 systemd journal 제거
  ansible.builtin.command: journalctl --vacuum-time=1s
  changed_when: true

# cloud-init이 다음 부팅을 최초 부팅으로 인식하게 하고 machine-id를 비운다.
# 이 태스크는 이미지 정리의 마지막 변경 작업이어야 한다.
- name: cloud-init 상태와 machine-id 정리
  ansible.builtin.command:
    argv:
      - cloud-init
      - clean
      - --logs
      - --machine-id
  changed_when: true

- name: Golden Image에 남으면 안 되는 경로 확인
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/kubernetes/kubelet.conf
    - /var/lib/tailscale/tailscaled.state
    - /run/cntlp-tailscale-auth-key
  register: golden_image_forbidden_paths

- name: 노드 고유 상태 제거 확인
  ansible.builtin.assert:
    that:
      - golden_image_forbidden_paths.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
    fail_msg: Golden Image에 kubeadm 또는 Tailscale 노드 상태가 남아 있습니다.

- name: machine-id가 비어 있는지 확인
  ansible.builtin.command: test ! -s /etc/machine-id
  changed_when: false
