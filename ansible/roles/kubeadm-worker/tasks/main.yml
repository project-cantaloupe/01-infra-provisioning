---
# kubelet·kubeadm 설치 후 워커로 조인한다.
#
# 이 롤은 두 부분으로 갈린다.
#   1. 설치 — 외부 의존 없음. 언제든 돌릴 수 있다
#   2. 조인 — 컨트롤플레인이 발급한 토큰이 있어야 한다
# 토큰이 없으면 1번까지만 하고 멈춘다. 조용히 건너뛰지 않는다.

# ── 0. 사전요건 검사 ───────────────────────────────────────────
#
# **여기서 설정하지 않는다. 검사만 한다.**
# swap·커널 모듈·sysctl 은 common 롤이, 런타임은 containerd 롤이 소유한다.
# 여기서 다시 설정하면 컨트롤플레인 롤에도 또 복제하게 되고 세 곳이 어긋난다.
#
# 검사가 필요한 이유는 `--tags join` 으로 이 롤만 단독 실행이 가능하기 때문이다.
# 그 경로로 들어오면 common 이 건너뛰어진다. kubeadm 자체 preflight 가 일부는
# 잡지만 늦게, 불친절한 메시지로 잡는다. 여기서 먼저 갈라준다.

- name: 사전요건을 모은다
  ansible.builtin.shell: |
    set -o pipefail
    # `|| echo inactive` 를 쓰지 않는다. is-active 는 실패해도 상태를 stdout 에
    # 찍으므로 "inactive" 가 두 줄 나오고, 두 번째 줄이 아래 파싱을 깨뜨린다.
    # containerd 가 죽어 있을 때 — 즉 이 검사가 필요한 바로 그때 — 터진다.
    runtime="$(systemctl is-active containerd 2>/dev/null | head -1 || true)"
    echo "swap: $(swapon --show --noheadings | wc -l)"
    echo "br: $(lsmod | grep -c '^br_netfilter' || true)"
    echo "overlay: $(lsmod | grep -c '^overlay' || true)"
    echo "forward: $(sysctl -n net.ipv4.ip_forward 2>/dev/null || echo 0)"
    echo "bridgenf: $(sysctl -n net.bridge.bridge-nf-call-iptables 2>/dev/null || echo 0)"
    echo "runtime: ${runtime:-inactive}"
  args:
    executable: /bin/bash
  register: _prereq
  changed_when: false

# 위에서 YAML 로 찍었으니 그대로 읽는다.
- name: 결과를 파싱한다
  ansible.builtin.set_fact:
    _pre: "{{ _prereq.stdout | from_yaml }}"

- name: 사전요건이 충족됐는지 본다
  ansible.builtin.assert:
    that:
      - _pre.swap | int == 0
      - _pre.br | int > 0
      - _pre.overlay | int > 0
      - _pre.forward | int == 1
      - _pre.bridgenf | int == 1
      - _pre.runtime == 'active'
    fail_msg: |
      kubeadm 사전요건이 충족되지 않았다. 이 롤은 이것들을 설정하지 않는다.
      common·containerd 롤을 먼저 돌린다:

        ansible-playbook playbooks/site-workers.yaml --tags os

      현재 상태 (기대값):
        swap 항목 수      = {{ _pre.swap }}       (0)
        br_netfilter      = {{ _pre.br }}         (1 이상)
        overlay           = {{ _pre.overlay }}    (1 이상)
        ip_forward        = {{ _pre.forward }}    (1)
        bridge-nf-call-iptables = {{ _pre.bridgenf }}  (1)
        containerd        = {{ _pre.runtime }}    (active)
    success_msg: "사전요건 충족 — swap off, br_netfilter/overlay, sysctl, containerd active"

# ── 1. 설치 ────────────────────────────────────────────────────

- name: keyrings 디렉터리를 만든다
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# curl | gpg 파이프를 쓰지 않는다. curl 이 403 이어도 gpg 가 성공하면서
# 0바이트 keyring 을 남기고, 그게 apt-get update 에서야 터진다.
# scripts/bootstrap-workstation.sh 가 같은 이유로 같은 구조를 쓴다.
- name: Kubernetes GPG 키를 받는다
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /tmp/k8s-release.key
    mode: "0644"

- name: 받은 키가 비어 있지 않은지 본다
  ansible.builtin.stat:
    path: /tmp/k8s-release.key
  register: _k8s_key

- name: 빈 키면 멈춘다
  ansible.builtin.assert:
    that: _k8s_key.stat.size > 0
    fail_msg: >-
      Kubernetes GPG 키가 비어 있다. kubernetes_minor={{ kubernetes_minor }} 가
      저장소에 없는 버전일 수 있다 (패치 버전을 넣으면 403 이다).

- name: 키를 dearmor 한다
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Kubernetes 저장소를 등록한다
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /
    filename: kubernetes
    state: present

# 패치까지 고정한다. 마이너가 컨트롤플레인과 어긋나면 조인이 거부된다.
- name: kubelet·kubeadm·kubectl 을 깐다
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_patch }}-*"
      - "kubeadm={{ kubernetes_patch }}-*"
      - "kubectl={{ kubernetes_patch }}-*"
    state: present
    update_cache: true
    # 위 apt_repository 가 이미 apt-get update 를 돌렸다. 두 번 돌리지 않는다.
    cache_valid_time: 3600
    allow_change_held_packages: true

# apt upgrade 가 마음대로 마이너를 올리면 조인이 깨진다.
- name: 버전을 hold 한다
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: kubelet 을 켠다
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: 설치된 버전을 확인한다
  ansible.builtin.command: kubeadm version -o short
  register: _kubeadm_ver
  changed_when: false

- name: 버전이 의도대로인지 본다
  ansible.builtin.assert:
    that: _kubeadm_ver.stdout is search(kubernetes_patch)
    fail_msg: "kubeadm 이 {{ kubernetes_patch }} 가 아니다: {{ _kubeadm_ver.stdout }}"
    success_msg: "kubeadm {{ _kubeadm_ver.stdout }}"

# ── 2. 조인 상태 판정 ──────────────────────────────────────────
#
# **"kubelet.conf 가 있으면 조인됨" 은 틀린 판정이다.** 클러스터를 다시 세우거나
# 엔드포인트를 옮기면 파일은 그대로 남고 내용만 낡는다. 파일 존재만 보고 건너뛰면
# 롤이 "조인 완료" 라고 보고하는데 노드는 죽은 클러스터를 보고 있다.
# 조용히 성공하는 형태라 알아채기 가장 어렵다.
#
# 그래서 **어디에 붙어 있는지**를 본다. 상태는 넷 중 하나다.
#
#   깨끗함        조인 흔적 없음                   → 조인한다
#   일치          기대 엔드포인트에 붙어 있음      → 건너뛴다 (멱등)
#   불일치        다른 엔드포인트에 붙어 있음      → 멈춘다
#   더러움        kubelet.conf 는 없는데 흔적 남음 → 멈춘다 (조인 중간 실패)
#
# 불일치·더러움에서 멈추는 것을 넘기려면 `kubeadm_force_rejoin=true` 를 준다.
# 그때만 `kubeadm reset` 이 돈다. 기본값으로는 절대 자원을 지우지 않는다.

- name: 조인 흔적을 모은다
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/kubernetes/kubelet.conf
    - /etc/kubernetes/pki/ca.crt
    - /var/lib/kubelet/config.yaml
  register: _k8s_traces

# kubelet.conf 는 kubeconfig 라서 서버 URL 이 평문으로 들어 있다.
# 토큰·키는 여기 없으므로 읽어도 비밀이 새지 않는다.
- name: 현재 붙어 있는 엔드포인트를 읽는다
  ansible.builtin.command:
    cmd: sed -nE 's#^[[:space:]]*server:[[:space:]]*https?://##p' /etc/kubernetes/kubelet.conf
  register: _cur_server
  changed_when: false
  when: _k8s_traces.results[0].stat.exists

- name: 조인에 필요한 값이 다 있는지 본다
  ansible.builtin.set_fact:
    _join_ready: >-
      {{ (kubeadm_api_endpoint | length > 0)
         and (kubeadm_token | length > 0)
         and (kubeadm_ca_cert_hash | length > 0) }}
    _joined: "{{ _k8s_traces.results[0].stat.exists }}"
    _dirty: >-
      {{ (not _k8s_traces.results[0].stat.exists)
         and (_k8s_traces.results[1].stat.exists
              or _k8s_traces.results[2].stat.exists) }}
    _cur_endpoint: "{{ (_cur_server.stdout | default('') | trim).split('\n') | first | default('') }}"

- name: 붙어 있는 곳이 기대와 같은지 본다
  ansible.builtin.set_fact:
    # 엔드포인트를 아직 모르면(설치만 하는 경로) 비교하지 않는다.
    _endpoint_matches: >-
      {{ (kubeadm_api_endpoint | length == 0)
         or (_cur_endpoint == kubeadm_api_endpoint) }}

- name: 다른 클러스터에 붙어 있으면 멈춘다
  ansible.builtin.fail:
    msg: |
      이 노드는 이미 **다른** 엔드포인트에 조인돼 있다.
        현재 : {{ _cur_endpoint }}
        기대 : {{ kubeadm_api_endpoint }}

      그대로 두면 노드가 낡은 클러스터를 계속 본다. 둘 중 하나를 고른다.

        1. VM 을 다시 만든다 (권장 — 가장 깨끗하다)
             kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
             kubectl delete node {{ inventory_hostname }}
             terraform -chdir=terraform/onprem destroy -target='proxmox_virtual_environment_vm.worker'
             terraform -chdir=terraform/onprem apply

        2. VM 을 유지하고 이 노드만 재조인한다
             먼저 위 drain·delete 로 클러스터에서 노드를 지운 뒤:
             ansible-playbook playbooks/site-workers.yaml --tags join -e kubeadm_force_rejoin=true

      docs/runbook-onprem-vm-recreate.md 를 본다.
  when:
    - _joined
    - not _endpoint_matches
    - not kubeadm_force_rejoin | bool

- name: 조인이 중간에 깨진 흔적이 있으면 멈춘다
  ansible.builtin.fail:
    msg: |
      kubelet.conf 는 없는데 조인 흔적이 남아 있다. 이전 조인이 중간에 실패한 상태다.
        /etc/kubernetes/pki/ca.crt      = {{ _k8s_traces.results[1].stat.exists }}
        /var/lib/kubelet/config.yaml    = {{ _k8s_traces.results[2].stat.exists }}

      이 상태로 kubeadm join 을 다시 돌리면 preflight 가
      "FileAvailable--etc-kubernetes-pki-ca.crt" 로 거부한다. 먼저 지운다.

        ansible-playbook playbooks/site-workers.yaml --tags join -e kubeadm_force_rejoin=true
  when:
    - _dirty
    - not kubeadm_force_rejoin | bool

# 값이 없으면 조용히 넘어가지 않는다. 무엇이 없는지 말하고 멈춘다.
- name: 조인 정보가 없으면 여기서 멈춘다
  ansible.builtin.fail:
    msg: |
      설치는 끝났지만 조인 정보가 없다. 컨트롤플레인 노드에서:
        kubeadm token create --print-join-command
      결과를 아래 3개로 나눠 환경변수로 넘긴다:
        KUBEADM_API_ENDPOINT=<host>:6443
        KUBEADM_TOKEN=<token>
        KUBEADM_CA_CERT_HASH=sha256:<hash>
      비어 있는 것: {{
        (['KUBEADM_API_ENDPOINT'] if kubeadm_api_endpoint | length == 0 else [])
        + (['KUBEADM_TOKEN'] if kubeadm_token | length == 0 else [])
        + (['KUBEADM_CA_CERT_HASH'] if kubeadm_ca_cert_hash | length == 0 else [])
      }}
  when:
    - not _joined
    - not _join_ready

# ── 3. 재조인 (kubeadm_force_rejoin=true 일 때만) ──────────────
#
# **클러스터에서 Node 오브젝트를 지우는 것은 여기서 하지 않는다.** 워커에는
# admin kubeconfig 가 없어서 할 수 없고, 있어도 워커가 자기를 지우는 것은
# 권한 경계를 넘는다. `kubectl drain`·`kubectl delete node` 는 사람이
# 워크스테이션에서 먼저 한다 — 위 실패 메시지와 런북에 순서가 있다.

- name: 조인 흔적을 지운다 (kubeadm reset)
  ansible.builtin.command: kubeadm reset -f
  when:
    - kubeadm_force_rejoin | bool
    - _joined or _dirty
  register: _reset
  changed_when: _reset.rc == 0

# reset 은 CNI 설정을 지우지 않는다. 남겨두면 다음 조인이 이전 클러스터의
# 파드 CIDR 을 물려받아 "노드는 Ready 인데 파드끼리 안 통하는" 상태가 된다.
- name: CNI 설정 잔여물을 지운다
  ansible.builtin.file:
    path: /etc/cni/net.d
    state: absent
  when:
    - kubeadm_force_rejoin | bool
    - _joined or _dirty

# iptables 는 건드리지 않는다. `kubeadm reset` 도 안 건드린다고 경고한다.
# SSH 로 붙어 있는 상태에서 규칙을 밀면 세션이 끊길 수 있고, ufw 규칙까지
# 같이 날아간다. kube-proxy 잔여 규칙은 **재부팅**으로 지우는 것이 안전하다.
# VM 을 다시 만드는 경로에서는 애초에 문제가 되지 않는다.
- name: kube-proxy 잔여 규칙 안내
  ansible.builtin.debug:
    msg: >-
      kubeadm reset 은 iptables 규칙을 지우지 않는다. 이 VM 을 유지한 채
      재조인했다면 파드 네트워킹이 이상할 때 재부팅을 먼저 시도한다.
  when:
    - kubeadm_force_rejoin | bool
    - _joined or _dirty

# ── 4. 조인 ────────────────────────────────────────────────────

# --node-ip 를 메시 IP 로 준다. LAN 주소로 조인하면 AWS·GCP 에서 이 노드에
# 못 닿아서 kubectl logs·exec 와 메트릭 수집이 전부 실패한다.
- name: 워커로 조인한다
  ansible.builtin.command:
    argv:
      - kubeadm
      - join
      - "{{ kubeadm_api_endpoint }}"
      - "--token={{ kubeadm_token }}"
      - "--discovery-token-ca-cert-hash={{ kubeadm_ca_cert_hash }}"
      - "--node-name={{ inventory_hostname }}"
      - "--node-labels=platform={{ kubeadm_node_labels.platform }},role={{ kubeadm_node_labels.role }}"
  when:
    - _join_ready
    - (not _joined) or (kubeadm_force_rejoin | bool)
  no_log: true
  register: _join
  changed_when: _join.rc == 0

- name: 조인 결과를 확인한다
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _kubelet_conf_after

- name: 붙은 엔드포인트를 다시 읽는다
  ansible.builtin.command:
    cmd: sed -nE 's#^[[:space:]]*server:[[:space:]]*https?://##p' /etc/kubernetes/kubelet.conf
  register: _final_server
  changed_when: false
  when: _kubelet_conf_after.stat.exists

# 파일 존재만 보지 않는다. 기대한 엔드포인트에 붙었는지까지 본다.
- name: 의도한 클러스터에 붙었는지 검사한다
  ansible.builtin.assert:
    that:
      - _kubelet_conf_after.stat.exists
      - (kubeadm_api_endpoint | length == 0)
        or ((_final_server.stdout | default('') | trim).split('\n') | first == kubeadm_api_endpoint)
    fail_msg: >-
      조인이 끝났는데 상태가 기대와 다르다.
      kubelet.conf 존재={{ _kubelet_conf_after.stat.exists }},
      엔드포인트={{ (_final_server.stdout | default('(없음)') | trim).split('\n') | first }},
      기대={{ kubeadm_api_endpoint | default('(미지정)', true) }}.
      조인 실패 원인은 no_log 로 가려진다 — 워커에서 직접
      `kubeadm join ... -v=5` 를 돌려 확인한다.
    success_msg: >-
      조인 완료 — {{ inventory_hostname }} →
      {{ (_final_server.stdout | default('') | trim).split('\n') | first }}
      (platform={{ kubeadm_node_labels.platform }}, role={{ kubeadm_node_labels.role }}).
      CNI 가 아직이면 NotReady 가 정상이다.
