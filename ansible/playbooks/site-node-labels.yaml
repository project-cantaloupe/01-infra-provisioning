---
# platform은 노드 이름으로 검증할 수 있지만 Worker의 role은 이름만으로 알 수 없다.
# role은 Terraform 태그 → 동적 인벤토리 → kubeadm join 순서로 전달한다.
- name: Kubernetes 전체 노드 필수 라벨 구성
  hosts: role_control_plane
  become: true
  gather_facts: false
  vars_files:
    - ../vars/cluster.yml
  vars:
    kubernetes_worker_roles:
      - service
      - devops
      - monitoring
      - messaging
      - logging
  tasks:
    - name: 클러스터 전체 노드 조회
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - get
          - nodes
          - -o
          - json
      register: kubernetes_cluster_nodes
      changed_when: false
      check_mode: false

    - name: 전체 노드 명명 규칙 확인
      ansible.builtin.assert:
        that:
          - item.metadata.name
            is match('^cntlp-(aws|gcp|onp)-(cp|wk)-[0-9]{2}$')
        fail_msg: >-
          {{ item.metadata.name }}은 Cantaloupe Kubernetes 노드 명명 규칙과
          맞지 않아 platform 라벨을 안전하게 결정할 수 없습니다.
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: 노드 이름과 일치하는 platform 라벨 적용
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - label
          - node
          - "{{ item.metadata.name }}"
          - "platform={{ item.metadata.name.split('-')[1] }}"
          - --overwrite
      when:
        - not ansible_check_mode
        - item.metadata.labels.platform | default('')
          != item.metadata.name.split('-')[1]
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      changed_when: true

    - name: Control Plane role 라벨 적용
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - label
          - node
          - "{{ item.metadata.name }}"
          - role=control-plane
          - --overwrite
      when:
        - not ansible_check_mode
        - item.metadata.name.split('-')[2] == 'cp'
        - item.metadata.labels.role | default('') != 'control-plane'
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      changed_when: true

    - name: Worker role 라벨 확인
      ansible.builtin.assert:
        that:
          - item.metadata.labels.role | default('') in kubernetes_worker_roles
        fail_msg: >-
          {{ item.metadata.name }}의 role 라벨이 없거나 허용값이 아닙니다.
          Terraform 태그와 동적 인벤토리에
          service/devops/monitoring/messaging/logging 중 하나를 지정하세요.
      when: item.metadata.name.split('-')[2] == 'wk'
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: 전체 노드 가격 메타데이터와 providerID 확인
      ansible.builtin.assert:
        that:
          - item.metadata.labels['topology.kubernetes.io/region'] | default('') | length > 0
          - item.metadata.labels['node.kubernetes.io/instance-type'] | default('') | length > 0
          - >-
            (item.metadata.labels.platform == 'onp'
             and item.spec.providerID | default('') is match('^custom:///'))
            or
            (item.metadata.labels.platform == 'aws'
             and item.spec.providerID | default('') is match('^aws:///'))
            or
            (item.metadata.labels.platform == 'gcp'
             and item.spec.providerID | default('') is match('^gce://'))
        fail_msg: >-
          {{ item.metadata.name }}의 region/instance-type 라벨 또는
          AWS/GCP providerID가 FinOps Node 계약과 다릅니다.
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
