# AWS EC2 API에서 실행 중인 Cantaloupe 인스턴스를 자동으로 찾는다.
# Terraform이 붙인 태그가 그대로 Ansible 그룹이 된다.
plugin: amazon.aws.aws_ec2
regions: [ap-northeast-2]
filters:
  # 중지되거나 종료된 인스턴스는 inventory에서 제외한다.
  instance-state-name: running
  # 다른 프로젝트나 플랫폼의 EC2가 섞이지 않도록 필수 태그로 제한한다.
  "tag:org": cntlp
  "tag:platform": aws
# EICE 터널은 사설 IP 대신 EC2 인스턴스 ID를 대상으로 연다.
hostnames:
  - instance-id
# AWS가 제공한 host variable이 Ansible 예약어와 충돌하지 않도록 구분한다.
hostvars_prefix: aws_
compose:
  ansible_host: aws_instance_id
keyed_groups:
  # platform=aws → platform_aws 그룹
  - key: aws_ec2_tags.platform
    prefix: platform
  # role=control-plane/service → role_control_plane/role_service 그룹
  #
  # **role 은 Kubernetes 노드 전용이다.** 허용값은 control-plane · service ·
  # devops · monitoring · messaging · logging 이고, 이 값은 Terraform 태그 →
  # 이 인벤토리 → kubeadm join → Node 라벨까지 그대로 흘러간다
  # (playbooks/site-node-labels.yaml 이 종착지에서 검증한다).
  # → decisions/20260729_k8s-labeling-convention.md
  - key: aws_ec2_tags.role
    prefix: role
  # component=vault → component_vault 그룹
  #
  # 클러스터에 조인하지 않는 노드를 위한 것이다. Vault EC2 가 첫 사례다 —
  # role 을 붙이면 K8s 노드 전용 값에 K8s 아닌 값이 섞여 그 태그가 두 가지를
  # 뜻하게 된다. component 는 스택 이름이라 그런 충돌이 없다.
  - key: aws_ec2_tags.component
    prefix: component
