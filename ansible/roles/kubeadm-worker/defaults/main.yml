---
# K8s 버전 — 1.36.3 확정 (2026-07-29).
#
# **저장소 경로에는 마이너까지만 들어간다.**
#   core:/stable:/v1.36/deb   → 200
#   core:/stable:/v1.36.3/deb → 403
# 패치 고정은 경로가 아니라 apt 버전 지정으로 한다.
kubernetes_minor: "v1.36"
kubernetes_patch: "1.36.3"

# 컨트롤플레인이 발급한 join 명령의 구성요소.
# `kubeadm token create --print-join-command` 을 컨트롤플레인 노드에서 돌려 얻는다.
# **토큰은 절대 리포에 적지 않는다.** 환경변수로 넘긴다.
kubeadm_api_endpoint: "{{ lookup('env', 'KUBEADM_API_ENDPOINT') }}" # host:6443
kubeadm_token: "{{ lookup('env', 'KUBEADM_TOKEN') }}"
kubeadm_ca_cert_hash: "{{ lookup('env', 'KUBEADM_CA_CERT_HASH') }}" # sha256:...

# 이미 조인된(또는 조인이 중간에 깨진) 노드를 강제로 재조인할지.
#
# **기본값은 false 이고, false 인 동안 이 롤은 아무것도 지우지 않는다.**
# true 로 주면 `kubeadm reset -f` 와 /etc/cni/net.d 삭제가 돈다.
#
# 쓰는 경우는 두 가지다.
#   1. 클러스터를 다시 세워서 노드가 낡은 엔드포인트를 보고 있다
#   2. 이전 조인이 중간에 실패해 흔적만 남았다 (preflight FileAvailable 오류)
#
# **먼저 클러스터에서 Node 오브젝트를 지운다.** 이 롤은 그것을 못 한다 —
# 워커에는 admin kubeconfig 가 없다.
#   kubectl drain <노드> --ignore-daemonsets --delete-emptydir-data
#   kubectl delete node <노드>
#
# VM 을 다시 만드는 경로에서는 이 플래그가 필요 없다. 흔적이 애초에 없다.
#   ansible-playbook playbooks/site-workers.yaml --tags join -e kubeadm_force_rejoin=true
kubeadm_force_rejoin: false

# 조인 시 붙일 노드 라벨. 팀 협약을 따른다.
# → decisions/20260729_k8s-labeling-convention.md
# 인벤토리 그룹(platform_onp, role_devops)에서 그대로 끌어온다.
kubeadm_node_labels:
  platform: "{{ (group_names | select('match', '^platform_') | first | default('platform_unknown')) | replace('platform_', '') }}"
  role: "{{ (group_names | select('match', '^role_') | first | default('role_unknown')) | replace('role_', '') }}"
