---
# 워커를 클러스터에 조인한다.
#
# **설치는 여기서 하지 않는다.** kubelet·kubeadm·kubectl 은 kubeadm-common 이,
# swap·커널 모듈·sysctl 은 common 이, 런타임은 containerd 가 소유한다.
# 여기서 다시 설정하면 컨트롤플레인 롤에도 또 복제하게 되고 세 곳이 어긋난다.
#
# 대신 **사전요건을 검사한다.** `--tags join` 으로 이 롤만 단독 실행할 수 있고,
# 그 경로로 들어오면 위 롤들이 건너뛰어지기 때문이다. kubeadm 자체 preflight 가
# 일부는 잡지만 늦게, 불친절한 메시지로 잡는다. 여기서 먼저 갈라준다.

# ── 0. 사전요건 검사 ───────────────────────────────────────────

- name: Worker 구성 전제 확인
  ansible.builtin.assert:
    that:
      - groups['role_control_plane'] | default([]) | length == 1
      - tailscale_ipv4 is defined
      - kubernetes_node_platform | length > 0
      - kubernetes_node_role | length > 0
      - kubernetes_node_region | length > 0
      - kubernetes_node_instance_type | length > 0
      - kubernetes_node_platform == 'onp' or kubernetes_node_provider_id | length > 0
      - ansible_facts.hostname
        is match('^cntlp-(aws|gcp|onp)-wk-[0-9]{2}$')
    fail_msg: Control Plane 그룹, Tailscale IP 또는 Worker 명명 규칙을 확인하세요.

- name: 노드 사전요건을 모은다
  ansible.builtin.shell: |
    set -o pipefail
    # `|| echo inactive` 를 쓰지 않는다. is-active 는 실패해도 상태를 stdout 에
    # 찍으므로 "inactive" 가 두 줄 나오고, 두 번째 줄이 아래 파싱을 깨뜨린다.
    # containerd 가 죽어 있을 때 — 즉 이 검사가 필요한 바로 그때 — 터진다.
    runtime="$(systemctl is-active containerd 2>/dev/null | head -1 || true)"
    echo "swap: $(swapon --show --noheadings | wc -l)"
    echo "br: $(lsmod | grep -c '^br_netfilter' || true)"
    echo "overlay: $(lsmod | grep -c '^overlay' || true)"
    echo "forward: $(sysctl -n net.ipv4.ip_forward 2>/dev/null || echo 0)"
    echo "bridgenf: $(sysctl -n net.bridge.bridge-nf-call-iptables 2>/dev/null || echo 0)"
    echo "runtime: ${runtime:-inactive}"
  args:
    executable: /bin/bash
  register: kubeadm_prereq_raw
  changed_when: false
  check_mode: false

# 위에서 YAML 로 찍었으니 그대로 읽는다.
- name: 사전요건 결과를 파싱한다
  ansible.builtin.set_fact:
    kubeadm_prereq: "{{ kubeadm_prereq_raw.stdout | from_yaml }}"

- name: 사전요건이 충족됐는지 본다
  ansible.builtin.assert:
    that:
      - kubeadm_prereq.swap | int == 0
      - kubeadm_prereq.br | int > 0
      - kubeadm_prereq.overlay | int > 0
      - kubeadm_prereq.forward | int == 1
      - kubeadm_prereq.bridgenf | int == 1
      - kubeadm_prereq.runtime == 'active'
    fail_msg: |
      kubeadm 사전요건이 충족되지 않았다. 이 롤은 이것들을 설정하지 않는다.
      사전 준비 플레이북을 먼저 돌린다:

        ansible-playbook playbooks/site-prerequisites.yaml --tags os

      현재 상태 (기대값):
        swap 항목 수            = {{ kubeadm_prereq.swap }}       (0)
        br_netfilter            = {{ kubeadm_prereq.br }}         (1 이상)
        overlay                 = {{ kubeadm_prereq.overlay }}    (1 이상)
        ip_forward              = {{ kubeadm_prereq.forward }}    (1)
        bridge-nf-call-iptables = {{ kubeadm_prereq.bridgenf }}   (1)
        containerd              = {{ kubeadm_prereq.runtime }}    (active)
    success_msg: "사전요건 충족 — swap off, br_netfilter/overlay, sysctl, containerd active"

# ── 1. 조인 상태 판정 ──────────────────────────────────────────
#
# **"kubelet.conf 가 있으면 조인됨" 은 틀린 판정이다.** 클러스터를 다시 세우거나
# 엔드포인트를 옮기면 파일은 그대로 남고 내용만 낡는다. 파일 존재만 보고 건너뛰면
# 롤이 "조인 완료" 라고 보고하는데 노드는 죽은 클러스터를 보고 있다.
# 조용히 성공하는 형태라 알아채기 가장 어렵다.
#
# 그래서 **어디에 붙어 있는지**를 본다. 상태는 넷 중 하나다.
#
#   깨끗함        조인 흔적 없음                   → 조인한다
#   일치          기대 엔드포인트에 붙어 있음      → 건너뛴다 (멱등)
#   불일치        다른 엔드포인트에 붙어 있음      → 멈춘다
#   더러움        kubelet.conf 는 없는데 흔적 남음 → 멈춘다 (조인 중간 실패)
#
# 불일치·더러움에서 멈추는 것을 넘기려면 `kubeadm_force_rejoin=true` 를 준다.
# 그때만 `kubeadm reset` 이 돈다. 기본값으로는 절대 자원을 지우지 않는다.

- name: 기대하는 API 엔드포인트를 정한다
  ansible.builtin.set_fact:
    # 컨트롤플레인은 메시 IP 로 초기화된다 (kubeadm-control-plane).
    # 같은 실행에서 vpn-mesh 가 컨트롤플레인에도 돌았을 때만 알 수 있다.
    # 모르면 비워 두고 비교를 건너뛴다 — 없는 값으로 잘못 멈추지 않는다.
    kubeadm_expected_endpoint: >-
      {{ (hostvars[groups['role_control_plane'][0]].tailscale_ipv4 | default(''))
         ~ (':' ~ kubernetes_control_plane_port
            if hostvars[groups['role_control_plane'][0]].tailscale_ipv4 | default('') | length > 0
            else '') }}

- name: 조인 흔적을 모은다
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ kubeadm_trace_paths }}"
  register: kubeadm_traces

# kubelet.conf 는 kubeconfig 라서 서버 URL 이 평문으로 들어 있다.
# 토큰·키는 여기 없으므로 읽어도 비밀이 새지 않는다.
- name: 현재 붙어 있는 엔드포인트를 읽는다
  ansible.builtin.command:
    cmd: >-
      sed -nE 's#^[[:space:]]*server:[[:space:]]*https?://##p' {{ kubelet_conf_path }}
  register: kubeadm_current_server
  changed_when: false
  check_mode: false
  when: kubeadm_traces.results[0].stat.exists

- name: 조인 상태를 판정한다
  ansible.builtin.set_fact:
    kubeadm_joined: "{{ kubeadm_traces.results[0].stat.exists }}"
    kubeadm_dirty: >-
      {{ (not kubeadm_traces.results[0].stat.exists)
         and (kubeadm_traces.results[1].stat.exists
              or kubeadm_traces.results[2].stat.exists) }}
    kubeadm_current_endpoint: >-
      {{ (kubeadm_current_server.stdout | default('') | trim).split('\n')
         | first | default('') }}

- name: 엔드포인트가 기대와 같은지 본다
  ansible.builtin.set_fact:
    # 기대 엔드포인트를 모르면 비교하지 않는다.
    kubeadm_endpoint_matches: >-
      {{ (kubeadm_expected_endpoint | length == 0)
         or (kubeadm_current_endpoint == kubeadm_expected_endpoint) }}

- name: 다른 클러스터에 붙어 있으면 멈춘다
  ansible.builtin.fail:
    msg: |
      이 노드는 이미 **다른** 엔드포인트에 조인돼 있다.
        현재 : {{ kubeadm_current_endpoint }}
        기대 : {{ kubeadm_expected_endpoint }}

      그대로 두면 노드가 낡은 클러스터를 계속 본다. 둘 중 하나를 고른다.

        1. VM 을 다시 만든다 (권장 — 가장 깨끗하다)
             kubectl drain {{ ansible_facts.hostname }} --ignore-daemonsets --delete-emptydir-data
             kubectl delete node {{ ansible_facts.hostname }}
             terraform -chdir=terraform/onp destroy -target='proxmox_virtual_environment_vm.worker'
             terraform -chdir=terraform/onp apply

        2. VM 을 유지하고 이 노드만 재조인한다
             먼저 위 drain·delete 로 클러스터에서 노드를 지운 뒤:
             ansible-playbook playbooks/site-workers.yaml --tags join -e kubeadm_force_rejoin=true

      docs/runbook-onp-vm-recreate.md 를 본다.
  when:
    - kubeadm_joined
    - not kubeadm_endpoint_matches
    - not kubeadm_force_rejoin | bool

- name: 조인이 중간에 깨진 흔적이 있으면 멈춘다
  ansible.builtin.fail:
    msg: |
      kubelet.conf 는 없는데 조인 흔적이 남아 있다. 이전 조인이 중간에 실패한 상태다.
        /etc/kubernetes/pki/ca.crt   = {{ kubeadm_traces.results[1].stat.exists }}
        /var/lib/kubelet/config.yaml = {{ kubeadm_traces.results[2].stat.exists }}

      이 상태로 kubeadm join 을 다시 돌리면 preflight 가
      "FileAvailable--etc-kubernetes-pki-ca.crt" 로 거부한다. 먼저 지운다.

        ansible-playbook playbooks/site-workers.yaml --tags join -e kubeadm_force_rejoin=true
  when:
    - kubeadm_dirty
    - not kubeadm_force_rejoin | bool

# ── 2. 재조인 (kubeadm_force_rejoin=true 일 때만) ──────────────
#
# **클러스터에서 Node 오브젝트를 지우는 것은 여기서 하지 않는다.** 워커에는
# admin kubeconfig 가 없어서 할 수 없고, 있어도 워커가 자기를 지우는 것은
# 권한 경계를 넘는다. `kubectl drain`·`kubectl delete node` 는 사람이
# 워크스테이션에서 먼저 한다 — 위 실패 메시지와 런북에 순서가 있다.

- name: 조인 흔적을 지운다 (kubeadm reset)
  ansible.builtin.command: kubeadm reset -f
  when:
    - kubeadm_force_rejoin | bool
    - kubeadm_joined or kubeadm_dirty
  register: kubeadm_reset
  changed_when: kubeadm_reset.rc == 0

# reset 은 CNI 설정을 지우지 않는다. 남겨두면 다음 조인이 이전 클러스터의
# 파드 CIDR 을 물려받아 "노드는 Ready 인데 파드끼리 안 통하는" 상태가 된다.
- name: CNI 설정 잔여물을 지운다
  ansible.builtin.file:
    path: /etc/cni/net.d
    state: absent
  when:
    - kubeadm_force_rejoin | bool
    - kubeadm_joined or kubeadm_dirty

# iptables 는 건드리지 않는다. `kubeadm reset` 도 안 건드린다고 경고한다.
# SSH 로 붙어 있는 상태에서 규칙을 밀면 세션이 끊길 수 있고, ufw 규칙까지
# 같이 날아간다. kube-proxy 잔여 규칙은 **재부팅**으로 지우는 것이 안전하다.
# VM 을 다시 만드는 경로에서는 애초에 문제가 되지 않는다.
- name: kube-proxy 잔여 규칙 안내
  ansible.builtin.debug:
    msg: >-
      kubeadm reset 은 iptables 규칙을 지우지 않는다. 이 VM 을 유지한 채
      재조인했다면 파드 네트워킹이 이상할 때 재부팅을 먼저 시도한다.
  when:
    - kubeadm_force_rejoin | bool
    - kubeadm_joined or kubeadm_dirty

# ── 3. 조인 ────────────────────────────────────────────────────
#
# 토큰은 컨트롤플레인에서 그때그때 발급하고 끝나면 지운다. TTL 도 짧게 준다.
# 리포나 환경변수에 장기 토큰을 두지 않기 위해서다.

- name: 신규 Worker 가입
  when: (not kubeadm_joined) or (kubeadm_force_rejoin | bool)
  block:
    - name: Worker 전용 단기 join 명령 생성
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - "--ttl={{ kubeadm_join_token_ttl }}"
          - --print-join-command
      delegate_to: "{{ groups['role_control_plane'][0] }}"
      register: kubeadm_join_command
      changed_when: true
      no_log: true

    - name: join 명령에서 필요한 값 분리
      ansible.builtin.set_fact:
        kubeadm_join_endpoint: "{{ kubeadm_join_command.stdout.split()[2] }}"
        kubeadm_join_token: "{{ kubeadm_join_command.stdout.split()[4] }}"
        kubeadm_join_ca_hash: "{{ kubeadm_join_command.stdout.split()[6] }}"
      no_log: true

    - name: join 명령 형식 확인
      ansible.builtin.assert:
        that:
          - kubeadm_join_endpoint | length > 0
          - kubeadm_join_token is match('^[a-z0-9]{6}\.[a-z0-9]{16}$')
          - kubeadm_join_ca_hash is match('^sha256:[a-f0-9]{64}$')
        fail_msg: kubeadm join 명령을 해석할 수 없습니다.
      no_log: true

    - name: Worker join 설정 임시 배치
      ansible.builtin.template:
        src: kubeadm-join.yaml.j2
        dest: "{{ kubeadm_join_config_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Worker join 설정 검증
      ansible.builtin.command:
        argv:
          - kubeadm
          - config
          - validate
          - --config
          - "{{ kubeadm_join_config_path }}"
      changed_when: false
      no_log: true

    - name: Worker 클러스터 가입
      ansible.builtin.command:
        argv:
          - kubeadm
          - join
          - --config
          - "{{ kubeadm_join_config_path }}"
        creates: "{{ kubelet_conf_path }}"
      no_log: true

  always:
    - name: 생성한 join token 제거
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - delete
          - "{{ kubeadm_join_token }}"
      delegate_to: "{{ groups['role_control_plane'][0] }}"
      when: kubeadm_join_token is defined
      changed_when: true
      failed_when: false
      no_log: true

    - name: Worker join 임시 설정 제거
      ansible.builtin.file:
        path: "{{ kubeadm_join_config_path }}"
        state: absent
      no_log: true

# ── 4. 결과 검증 ───────────────────────────────────────────────
#
# 파일 존재만 보지 않는다. 기대한 엔드포인트에 붙었는지까지 본다.

- name: Worker 가입 완료 확인
  ansible.builtin.stat:
    path: "{{ kubelet_conf_path }}"
  register: kubelet_conf_after

- name: 붙은 엔드포인트를 다시 읽는다
  ansible.builtin.command:
    cmd: >-
      sed -nE 's#^[[:space:]]*server:[[:space:]]*https?://##p' {{ kubelet_conf_path }}
  register: kubeadm_final_server
  changed_when: false
  check_mode: false
  when: kubelet_conf_after.stat.exists

- name: 의도한 클러스터에 붙었는지 검사
  ansible.builtin.assert:
    that:
      - kubelet_conf_after.stat.exists
      - (kubeadm_expected_endpoint | length == 0)
        or ((kubeadm_final_server.stdout | default('') | trim).split('\n') | first
            == kubeadm_expected_endpoint)
    fail_msg: >-
      조인이 끝났는데 상태가 기대와 다르다.
      kubelet.conf 존재={{ kubelet_conf_after.stat.exists }},
      엔드포인트={{ (kubeadm_final_server.stdout | default('(없음)') | trim).split('\n') | first }},
      기대={{ kubeadm_expected_endpoint | default('(미지정)', true) }}.
      조인 실패 원인은 no_log 로 가려진다 — 워커에서 직접
      `kubeadm join ... -v=5` 를 돌려 확인한다.
    success_msg: >-
      조인 완료 — {{ ansible_facts.hostname }} →
      {{ (kubeadm_final_server.stdout | default('') | trim).split('\n') | first }}.
      CNI 가 아직이면 NotReady 가 정상이다.

# ── 5. kubelet node-ip 보완과 라벨 ─────────────────────────────

- name: kubeadm이 저장한 kubelet 플래그 파일 확인
  ansible.builtin.stat:
    path: "{{ kubelet_kubeadm_flags_path }}"
  register: kubelet_flags_file

- name: kubeadm kubelet 플래그 조회
  ansible.builtin.slurp:
    src: "{{ kubelet_kubeadm_flags_path }}"
  register: kubelet_flags_content
  when: kubelet_flags_file.stat.exists

# 기존 수동 가입 노드에 node-ip 플래그가 없을 때만 보완한다.
- name: kubelet Tailscale node-ip 영구 설정 보완
  ansible.builtin.lineinfile:
    path: /etc/default/kubelet
    regexp: '^KUBELET_EXTRA_ARGS='
    line: "KUBELET_EXTRA_ARGS=--node-ip={{ tailscale_ipv4 }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: >-
    not kubelet_flags_file.stat.exists
    or (
      '--node-ip=' ~ tailscale_ipv4
      not in (kubelet_flags_content.content | default('') | b64decode)
    )
  notify: kubelet 재시작

- name: 변경된 kubelet 설정 즉시 반영
  ansible.builtin.meta: flush_handlers

- name: Worker Ready 상태 대기
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - wait
      - --for=condition=Ready
      - "node/{{ ansible_facts.hostname }}"
      - --timeout=5m
  delegate_to: "{{ groups['role_control_plane'][0] }}"
  changed_when: false
  check_mode: false

- name: 현재 Worker 사용자 라벨 조회
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - get
      - node
      - "{{ ansible_facts.hostname }}"
      - "-o=jsonpath={.metadata.labels.platform}:{.metadata.labels.role}:{.metadata.labels.topology\\.kubernetes\\.io/region}:{.metadata.labels.node\\.kubernetes\\.io/instance-type}"
  delegate_to: "{{ groups['role_control_plane'][0] }}"
  register: worker_labels
  changed_when: false
  check_mode: false

- name: Worker 필수 라벨 적용
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - label
      - node
      - "{{ ansible_facts.hostname }}"
      - "platform={{ kubernetes_node_platform }}"
      - "role={{ kubernetes_node_role }}"
      - "topology.kubernetes.io/region={{ kubernetes_node_region }}"
      - "node.kubernetes.io/instance-type={{ kubernetes_node_instance_type }}"
      - --overwrite
  delegate_to: "{{ groups['role_control_plane'][0] }}"
  when: >-
    worker_labels.stdout | trim
    != kubernetes_node_platform ~ ':' ~ kubernetes_node_role ~ ':'
       ~ kubernetes_node_region ~ ':' ~ kubernetes_node_instance_type
  changed_when: true
