---
- name: Ubuntu 노드인지 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: 현재 Tailscale 설치 역할은 Ubuntu만 지원합니다.

- name: Tailscale 저장소에 필요한 패키지 설치
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: tailscale_manage_packages | bool

- name: Tailscale 패키지 서명 키 설치
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/ubuntu/{{
      ansible_facts.distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  when: tailscale_manage_packages | bool

- name: Tailscale APT 저장소 추가
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu
      {{ ansible_facts.distribution_release }} main
    filename: tailscale
    state: present
    update_cache: true
  when: tailscale_manage_packages | bool

- name: Tailscale 설치
  ansible.builtin.apt:
    name: tailscale
    state: present
  when: tailscale_manage_packages | bool

- name: tailscaled 서비스 활성화
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

# 이미 올바른 tailnet에 가입된 노드는 상태를 유지하고 새 노드만 인증한다.
- name: 현재 Tailscale IPv4 조회
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: 미가입 노드에 사용할 Tailscale 인증 키 확인
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: >-
      노드가 tailnet에 가입되어 있지 않습니다.
      CNTLP_TAILSCALE_AUTH_KEY 환경변수로 인증 키를 전달하세요.
  when:
    - tailscale_ip_before.rc != 0
      or tailscale_ip_before.stdout | trim | length == 0

- name: 미가입 노드를 tailnet에 등록
  when:
    - tailscale_ip_before.rc != 0
      or tailscale_ip_before.stdout | trim | length == 0
  block:
    - name: Tailscale 인증 키 임시 배치
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: "{{ tailscale_auth_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: 인증 키 파일로 tailnet 가입
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key=file:{{ tailscale_auth_key_path }}"
          - "--hostname={{ tailscale_hostname }}"
          - --timeout=2m
      changed_when: true
      no_log: true
  always:
    - name: Tailscale 인증 키 임시 파일 제거
      ansible.builtin.file:
        path: "{{ tailscale_auth_key_path }}"
        state: absent
      no_log: true

- name: 사용할 Tailscale IPv4 확정
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_result
  changed_when: false
  check_mode: false

- name: Tailscale IPv4 형식 확인
  ansible.builtin.assert:
    that:
      - tailscale_ip_result.stdout | trim | length > 0
      - tailscale_ip_result.stdout | trim
        is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: Tailscale IPv4를 확인할 수 없습니다.

- name: 이후 Kubernetes 역할에서 사용할 Tailscale IPv4 저장
  ansible.builtin.set_fact:
    tailscale_ipv4: "{{ tailscale_ip_result.stdout | trim }}"
