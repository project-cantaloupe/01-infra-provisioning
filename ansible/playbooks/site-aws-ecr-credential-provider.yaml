---
# 이미 조인된 AWS Worker는 한 대씩 kubelet을 재시작한다. 새 노드는 같은 역할로
# 바이너리와 설정을 설치한 뒤 kubeadm JoinConfiguration에서 인자를 받는다.
- name: AWS Worker ECR image credential provider 구성
  hosts: platform_aws:!role_control_plane
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: ecr-credential-provider
      tags: [aws, ecr, kubelet]
