---
- name: Calico 구성 전제 확인
  ansible.builtin.assert:
    that:
      - kubernetes_admin_conf is defined
      - kubernetes_pod_cidr is defined
      - calico_version is defined
      - calico_mtu | int > 0
      # 형태만 본다. 값이 왜 이래야 하는지는 vars/cluster.yml 주석에 있다.
      # 여기서 막는 이유는 오타가 나면 Felix 가 마스크를 무시하고 기본값으로
      # 돌아가서 — Tailscale 과 다시 겹친 채 — 조용히 성공하기 때문이다.
      - calico_iptables_mark_mask is defined
      - calico_iptables_mark_mask is match('^0x[0-9a-f]{8}$')
      # **CRD 필드가 int32 다.** 0x80000000 이상이면 API 서버가 거부한다 —
      # "Checked value must be of type integer with format int32". 여기서
      # 막지 않으면 롤이 apply 단계까지 가서 죽는다.
      - (calico_iptables_mark_mask | int(base=16)) <= 2147483647
      # Tailscale 이 쓰는 0x40000(비트 18)·0x80000(비트 19)이 비어 있어야 한다.
      # jinja 에 비트 AND 가 없어서 그 두 자리만 잘라 본다:
      # 0x40000 으로 나눈 몫의 하위 2비트가 0 이면 둘 다 안 켜진 것이다.
      - (((calico_iptables_mark_mask | int(base=16)) // 262144) % 4) == 0
    fail_msg: Kubernetes 또는 Calico 공통 변수를 확인하세요.

- name: Control Plane kubeconfig 확인
  ansible.builtin.stat:
    path: "{{ kubernetes_admin_conf }}"
  register: calico_admin_conf

- name: Control Plane 초기화 완료 확인
  ansible.builtin.assert:
    that:
      - calico_admin_conf.stat.exists
    fail_msg: Calico보다 먼저 Control Plane을 초기화해야 합니다.

- name: Calico 매니페스트 디렉터리 생성
  ansible.builtin.file:
    path: "{{ calico_manifest_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Calico 매니페스트 디렉터리 존재 확인
  ansible.builtin.stat:
    path: "{{ calico_manifest_directory }}"
  register: calico_manifest_directory_state

- name: Calico ProjectCalico CRD 매니페스트 다운로드
  ansible.builtin.get_url:
    url: "{{ calico_manifest_base_url }}/v1_crd_projectcalico_org.yaml"
    dest: "{{ calico_crd_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
      or calico_manifest_directory_state.stat.exists

- name: Tigera Operator 매니페스트 다운로드
  ansible.builtin.get_url:
    url: "{{ calico_manifest_base_url }}/tigera-operator.yaml"
    dest: "{{ calico_operator_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
      or calico_manifest_directory_state.stat.exists

- name: Cantaloupe Calico 설정 배치
  ansible.builtin.template:
    src: custom-resources.yaml.j2
    dest: "{{ calico_custom_resources_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
      or calico_manifest_directory_state.stat.exists

# server-side apply는 큰 CRD의 last-applied annotation 크기 제한을 피한다.
- name: Calico ProjectCalico CRD 적용
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - apply
      - --server-side
      - --force-conflicts
      - --field-manager=ansible-cntlp
      - -f
      - "{{ calico_crd_manifest_path }}"
  changed_when: false

- name: Tigera Operator 적용
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - apply
      - --server-side
      - --force-conflicts
      - --field-manager=ansible-cntlp
      - -f
      - "{{ calico_operator_manifest_path }}"
  changed_when: false

- name: Tigera Operator 준비 상태 확인
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - -n
      - tigera-operator
      - rollout
      - status
      - deployment/tigera-operator
      - --timeout=5m
  changed_when: false
  check_mode: false

- name: Calico Installation 및 API Server 적용
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - apply
      - --server-side
      - --force-conflicts
      - --field-manager=ansible-cntlp
      - -f
      - "{{ calico_custom_resources_path }}"
  changed_when: false

- name: Calico Installation 준비 상태 확인
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - wait
      - --for=condition=Ready
      - installation.operator.tigera.io/default
      - --timeout=10m
  changed_when: false
  check_mode: false

# ── mark 마스크가 실제로 먹었는지 ──────────────────────────────
#
# **오브젝트가 들어간 것과 Felix 가 그 값을 쓴 것은 다르다.** 마스크 비트가
# 모자라면 Felix 는 죽지 않고 로그만 남기고 기본값 근처로 돌아간다. 그러면
# Tailscale 과 다시 겹친 채 클러스터가 "정상" 으로 보인다 — 이 롤이 막으려는
# 바로 그 상태다.
#
# **입력이 아니라 결과를 검사한다.** Felix 는 부팅할 때마다 자기가 고른 비트를
# 로그에 통째로 찍는다. 그 줄을 직접 읽고 Tailscale 비트와 겹치는지 센다.
#
#   [INFO] felix/driver.go 171: Calculated iptables mark bits
#     acceptMark=0x100000 dropMark=0x400000 endpointMark=0x7e000000
#     passMark=0x200000 scratch0Mark=0x800000 scratch1Mark=0x1000000
#
# 기본 마스크(0xffff0000)에서는 같은 줄이 이렇게 나온다 — 2026-08-03 실측:
#
#     dropMark=0x40000  scratch0Mark=0x80000       ← Tailscale 의 비트 18·19
#
# **한때 여기서 `grep -i 'mark bit'` 로 "불평 건수"를 셌는데 그게 위양성이었다.**
# 위 정상 INFO 줄의 "mark bits" 를 잡아서 항상 0 이 아니게 나온다. 그리고 마스크
# 값은 jsonpath 가 10진수로 주는데 문자열 "0x..." 와 비교하고 있어서, 값이 맞아도
# 항상 실패했다. 두 검사가 모두 죽어 있었다 — 그래서 결과를 세는 방식으로 바꿨다.
# → findings/20260803_calico-tailscale-mark-collision.md
- name: Felix 가 고른 mark 비트를 조회한다
  ansible.builtin.shell: |
    set -o pipefail
    K="kubectl --kubeconfig {{ kubernetes_admin_conf }}"
    mask=$($K get felixconfiguration default \
      -o jsonpath='{.spec.iptablesMarkMask}' 2>/dev/null || true)
    line=$($K -n calico-system logs ds/calico-node -c calico-node --tail=-1 2>/dev/null \
      | grep 'Calculated iptables mark bits' | tail -1 || true)
    # 0xc0000 = 비트 18·19. Tailscale 의 subnet-route(0x40000)와 bypass(0x80000).
    overlap=0
    for m in $(printf '%s' "$line" | grep -oE '0x[0-9a-f]+' || true); do
      if [ $(( m & 0xc0000 )) -ne 0 ]; then overlap=$((overlap + 1)); fi
    done
    echo "mask: '${mask}'"
    echo "overlap: ${overlap}"
    echo "found: $([ -n "$line" ] && echo 1 || echo 0)"
    echo "calculated: '${line##*driver.go }'"
  args:
    executable: /bin/bash
  register: calico_mark_state
  changed_when: false
  check_mode: false

- name: Felix mark 결과를 파싱한다
  ansible.builtin.set_fact:
    calico_mark: "{{ calico_mark_state.stdout | from_yaml }}"

- name: Felix 가 Tailscale 비트를 피했는지 확인한다
  ansible.builtin.assert:
    that:
      # jsonpath 는 10진수를 준다. 숫자로 맞춘다 — 문자열로 비교하지 않는다.
      - calico_mark.mask | int == calico_iptables_mark_mask | int(base=16)
      # 로그 줄을 못 찾았으면(회전됐으면) 겹침 판정을 못 한다. 마스크만 본다.
      - (calico_mark.found | int == 0) or (calico_mark.overlap | int == 0)
    fail_msg: |
      Felix 의 mark 설정이 의도와 다르다.
        FelixConfiguration : {{ calico_mark.mask | default('(없음)', true) }} (10진수)
        기대               : {{ calico_iptables_mark_mask | int(base=16) }}
                             ({{ calico_iptables_mark_mask }})
        Tailscale 비트와 겹치는 mark : {{ calico_mark.overlap }} 개
        Felix 가 고른 비트 : {{ calico_mark.calculated | default('(로그 없음)', true) }}

      **겹침이 0 이 아니면 파드 트래픽이 비결정적으로 죽는다.** Felix 가 세운
      비트를 tailscaled 의 ip rule(우선순위 5250 = unreachable)이 집어간다.

      마스크가 안 들어갔으면 int32 를 넘겼는지 먼저 본다 — CRD 필드가 int32 라
      0x80000000 이상은 API 서버가 거부한다. 비트가 모자라다는 로그가 있으면
      vars/cluster.yml 의 값을 0x7ff30000 으로 올린다 (비트 16·17 추가).
    success_msg: >-
      Felix mark = {{ calico_mark.calculated | default('(로그 없음)', true) }}
      — Tailscale 의 0x40000·0x80000 과 겹치지 않는다
  when: not ansible_check_mode

- name: CoreDNS 준비 상태 확인
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - -n
      - kube-system
      - rollout
      - status
      - deployment/coredns
      - --timeout=10m
  changed_when: false
  check_mode: false
