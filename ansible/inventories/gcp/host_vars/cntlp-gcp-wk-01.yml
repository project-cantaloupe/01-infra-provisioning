---
# 모니터링 UI 세 개를 MagicDNS HTTPS 로 내보내는 노드.
#
# ⚠️ **이 맵은 실물을 코드로 되받은 것이다** (2026-08-11 `tailscale serve
# status` 대조). 이 노드의 serve 는 여태 **손으로** 설정돼 있었고 ansible 이
# 모르는 상태였다. 그래서 `tailscale_serve_enabled` 를 grep 해서 "이 노드엔
# 경로가 없다"고 읽으면 틀린다 — **인벤토리는 진실이 아니고 노드가 진실이다.**
#
# 여기 적기 전에 세 경로가 이미 살아 있었다:
#   /grafana/login  200    /prometheus/  302    /  200
#
# 롤이 맵 전체를 소유하므로 **하나라도 빠뜨리면 수렴 때 사라진다.**
#
# ── 왜 이 노드에 셋 다 있나 ────────────────────────────────────
#
# 셋 다 Service 가 `externalTrafficPolicy: Local` 이고 파드가 전부 이
# 노드에 있다. Local 은 그 노드에 엔드포인트가 없으면 NodePort 로 들어온
# 트래픽을 **버린다** — 거부가 아니라 무응답이라 원인을 찾기 어렵다.
# 그래서 UI 프론트인 cntlp-onp-wk-01 로 옮길 수 없다.
tailscale_serve_enabled: true
tailscale_serve_expected_dns_name: cntlp-gcp-wk-01.tail270b85.ts.net

# ⚠️ `tailscale_tags` 를 여기서 덮지 않는다. platform_gcp.yml 의
# `tag:cntlp-wk` 를 그대로 쓴다. cntlp-onp-wk-01 이 같은 태그 하나로 serve 를
# 돌리고 있어(2026-08-11 tailnet 실측 — host_vars 에 적힌 `tag:cntlp-ui` 는
# 실제로 안 붙어 있다) 태그를 더할 이유가 없고, 태그 변경은 auth key
# 재조인을 요구해 되돌리기가 비싸다.

tailscale_serve_routes:
  # ── 루트는 인증 게이트다 (2026-08-11 변경) ─────────────────────
  #
  # 전에는 `/` → OpenCost, `/prometheus` → Prometheus 로 **두 UI 를 직접**
  # 가리켰다. 둘 다 로그인 화면이 없는 UI 라서 tailnet 참여자 누구나
  # 읽을 수 있었다 → tasks/.../015_sso-loose-ends.md A1
  #
  # 지금은 monitoring-gateway(oauth2-proxy)가 루트에 서고 경로 분기를
  # 프록시가 한다. UI 쪽 NodePort 는 없앴다.
  #
  # ⚠️ **접두사 없이 루트에 두는 것이 설계의 핵심이다.** tailscale 은
  # `--set-path` 접두사를 벗겨서 백엔드에 넘기는데, 그러면 프록시가
  # 자기 접두사를 몰라서 **로그인 뒤 착지 URL 에서 그것을 잃는다**
  # (로깅 게이트에서 실제로 난 버그다). 루트면 안팎의 좌표계가 같다.
  #
  # ⚠️ **check 를 `/` 로 두지 않는다.** 미인증 요청은 302 라서 롤의
  # HEAD 검사가 통과는 하지만, 프록시가 죽었는지 살았는지 못 가린다.
  # `/ping` 이 oauth2-proxy 의 인증 없는 헬스 경로다.
  - path: /
    backend: http://127.0.0.1:30919
    check: http://127.0.0.1:30919/ping

  # Grafana. `grafana.ini` 의 `root_url` + `serve_from_sub_path: true` 가
  # 같은 경로를 알고 있어야 한다
  # (02-k8s-manifests platform/gcp/kube-prometheus-stack/values.yaml).
  #
  # ⚠️ **게이트 뒤로 넣지 않는다.** Grafana 는 자체 OIDC 로그인이 있고
  # 그룹별 역할(Admin/Editor/Viewer)까지 가른다. 프록시를 앞에 두면
  # 인증이 두 번이 되고 역할 구분은 그대로 Grafana 몫이라 얻는 게 없다.
  #
  # ⚠️ **백엔드 끝에 슬래시를 붙이지 않는다.** 실물이 그렇고 그대로 돌고
  # 있다. `/grafana/` 로 바꾸면 수렴이 한 번 돌면서 경로가 전부 재생성된다.
  - path: /grafana
    backend: http://127.0.0.1:30300/grafana
    check: http://127.0.0.1:30300/grafana/login

  # ── `/prometheus` 경로는 없앴다 ────────────────────────────────
  #
  # 위 루트 게이트가 `/prometheus/` 를 받아 프록시 내부에서 업스트림으로
  # 보낸다. 접두사가 안 벗겨지므로 **Prometheus 쪽도 `routePrefix: /` 에서
  # `/prometheus` 로 같이 바꿨다** — 한쪽만 바꾸면 404 다.
