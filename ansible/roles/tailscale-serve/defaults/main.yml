---
tailscale_serve_enabled: false
tailscale_serve_https_port: 443

# 이 노드가 MagicDNS HTTPS 로 내보낼 경로 맵.
#
# **롤이 이 맵 전체를 소유한다.** 여기 없는 경로는 수렴 때 사라진다.
# 한때 이 롤은 백엔드 하나를 `/` 에 거는 형태였는데, 그 사이 손으로 붙인
# `/argocd` 가 생겨 **롤과 실물이 갈라졌다** (2026-08-11 실측:
# 롤 기본값은 31430 을 `/` 에 걸려 하는데 실물의 `/` 는 Harbor 32432 였다).
# 그 상태로 플레이북을 돌렸으면 Harbor UI 가 조용히 사라진다.
#
# 항목 형식:
#   - path:    URL 경로. `/` 도 명시한다
#     backend: tailscale 이 프록시할 대상
#     check:   (선택) 적용 전에 살아 있는지 확인할 URL. 없으면 backend 를 쓴다
#
# ⚠️ **백엔드 앱이 서브패스를 알아야 한다.** tailscale 은 경로를 그대로
# 넘길 뿐 재작성하지 않는다. Argo CD 는 `url:`, Grafana 는 `root_url` +
# `serve_from_sub_path`, Harbor 는 `externalURL` 이 그 자리다. 빠뜨리면
# 로그인은 되는데 리다이렉트가 깨진다.
#
# ⚠️ **`externalTrafficPolicy: Local` 인 Service 는 그 파드가 있는 노드에서만
# 받는다.** 다른 노드에서 프록시하면 조용히 죽는다 — 연결이 거부되는 게
# 아니라 응답이 없다. 어느 노드에 둘지는 파드 배치가 정한다.
tailscale_serve_routes: []

tailscale_serve_expected_dns_name: ""

# 백엔드 확인에서 통과로 볼 상태 코드. 401·403 도 통과다 — 인증을 요구하는
# 것은 앱이 살아 있다는 뜻이라서다.
tailscale_serve_allowed_status_codes:
  - 200
  - 301
  - 302
  - 307
  - 308
  - 401
  - 403

tailscale_serve_backend_validate_certs: false
tailscale_serve_backend_retries: 12
tailscale_serve_backend_delay: 5
