plugin: google.cloud.gcp_compute
projects: ["{{ lookup('env', 'GCP_PROJECT') }}"]
filters: ["status = RUNNING"]

# 인벤토리 호스트명을 인스턴스 이름으로 고정한다.
#
# 플러그인 기본값은 public_ip → private_ip → name 순으로 첫 번째 있는 것을 쓴다.
# GCP 워커는 외부 IP 가 없어서(Cloud NAT 로 나가기만 한다) private_ip 가 뽑히고,
# 호스트명이 `10.0.10.x` 가 된다. 이름으로 고정해야 아래 compose 도 읽히고
# 플레이북 출력도 사람이 읽을 수 있다.
hostnames:
  - name

compose:
  # **기본 ansible_host 는 내부 IP 라 워크스테이션에서 못 간다.**
  # 10.0.10.0/24 는 GCP VPC 안에서만 사는 대역이고, tailnet 은 이 대역을
  # 광고하지 않는다 (광고하는 것은 파드 CIDR 뿐 —
  # inventories/aws/group_vars/role_control_plane.yml).
  #
  # 도달 경로는 메시 하나뿐이므로 MagicDNS 이름을 직접 쓴다. AWS 가 인스턴스
  # ID + EICE 터널을 쓰는 것과 같은 자리의 선택이고, 이유만 다르다.
  #
  # 노드의 tailnet 이름은 vpn-mesh 롤이 `--hostname` 으로 호스트명과 같게
  # 맞춘다. 그래서 GCP 인스턴스 이름 = tailnet 이름이 성립한다. tailnet 에
  # 같은 이름이 이미 있으면 Tailscale 이 `-1` 을 붙이는데, 그러면 이 조립이
  # 깨진다 — 롤이 그 경우를 검사해서 멈춘다.
  ansible_host: name + '.tail270b85.ts.net'

keyed_groups:
  - key: labels.platform
    prefix: platform
  - key: labels.role
    prefix: role
