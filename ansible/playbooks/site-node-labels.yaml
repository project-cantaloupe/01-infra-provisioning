---
# 동적 인벤토리 밖에서 먼저 가입한 노드도 중앙 명명 규칙으로 라벨을 맞춘다.
- name: Kubernetes 전체 노드 필수 라벨 구성
  hosts: role_control_plane
  become: true
  gather_facts: false
  vars_files:
    - ../vars/cluster.yml
  tasks:
    - name: 클러스터 전체 노드 조회
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - get
          - nodes
          - -o
          - json
      register: kubernetes_cluster_nodes
      changed_when: false
      check_mode: false

    - name: 전체 노드 명명 규칙 확인
      ansible.builtin.assert:
        that:
          - item.metadata.name
            is match('^cntlp-(aws|gcp|onp)-(cp|wk)-[0-9]{2}$')
        fail_msg: >-
          {{ item.metadata.name }}은 Cantaloupe Kubernetes 노드 명명 규칙과
          맞지 않아 platform/role 라벨을 안전하게 결정할 수 없습니다.
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: 전체 노드 platform 및 role 라벨 적용
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - label
          - node
          - "{{ item.metadata.name }}"
          - "platform={{ item.metadata.name.split('-')[1] }}"
          - "role={{ 'control-plane' if item.metadata.name.split('-')[2] == 'cp' else 'service' }}"
          - --overwrite
      when:
        - not ansible_check_mode
        - item.metadata.labels.platform | default('')
          != item.metadata.name.split('-')[1]
          or item.metadata.labels.role | default('')
          != (
            'control-plane'
            if item.metadata.name.split('-')[2] == 'cp'
            else 'service'
          )
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      changed_when: true

    - name: Check mode에서 필요한 라벨 변경 표시
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}에
          platform={{ item.metadata.name.split('-')[1] }},
          role={{
            'control-plane'
            if item.metadata.name.split('-')[2] == 'cp'
            else 'service'
          }} 라벨이 필요합니다.
      when:
        - ansible_check_mode
        - item.metadata.labels.platform | default('')
          != item.metadata.name.split('-')[1]
          or item.metadata.labels.role | default('')
          != (
            'control-plane'
            if item.metadata.name.split('-')[2] == 'cp'
            else 'service'
          )
      loop: "{{ (kubernetes_cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      changed_when: true
