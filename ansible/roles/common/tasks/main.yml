---
- name: Ubuntu 노드인지 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: 현재 공통 노드 준비 역할은 Ubuntu만 지원합니다.

- name: 현재 활성화된 swap 비활성화
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: 재부팅 후에도 swap이 활성화되지 않도록 fstab 항목 주석 처리
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Kubernetes 커널 모듈 영구 설정
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Kubernetes 커널 모듈 즉시 로드
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Kubernetes 네트워크 sysctl 영구 설정
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  notify: Kubernetes sysctl 적용

- name: 변경된 sysctl 즉시 반영
  ansible.builtin.meta: flush_handlers

- name: swap 비활성 상태 확인
  ansible.builtin.command: swapon --show --noheadings
  register: swap_status
  changed_when: false
  failed_when: swap_status.stdout | trim | length > 0
