# ansible 은 플레이북 옆의 roles/ 를 먼저 본다. 우리 배치는
#   ansible/playbooks/site-workers.yaml
#   ansible/roles/<롤>/
# 이라 playbooks/roles/ 를 찾다가 "the role 'common' was not found" 로 죽는다.
# 이 파일이 있으면 ansible 이 이 디렉터리를 기준으로 roles_path 를 잡는다.
#
# **ansible.cfg 는 현재 작업 디렉터리에서만 자동으로 읽힌다.**
# 그래서 명령을 `ansible/` 안에서 돌리거나 ANSIBLE_CONFIG 를 지정해야 한다.
# scripts/cantaloupe-env.sh 가 그것까지 해준다.

[defaults]
roles_path = ./roles
collections_path = .collections

# 기본 인벤토리는 온프렘이다. 지금 실제로 파싱되는 유일한 소스이고
# scripts/join-worker.sh 가 -i 없이 이 기본값에 의존한다.
#
# **AWS·GCP 를 대상으로 하는 플레이북은 -i 를 반드시 붙인다.**
#   ansible-playbook -i inventories/aws/aws_ec2.yaml playbooks/site-control-plane.yaml
#   ansible-playbook -i inventories/gcp/gcp_compute.yaml playbooks/site-workers.yaml
#
# 세 소스를 여기 한꺼번에 나열하지 않는 이유는 아래 unparsed_is_failed 때문이다 —
# 자격증명이 없는 소스 하나가 전체 실행을 막는다. AWS 컨트롤플레인이 서면 다시 정한다.
inventory = ./inventories/onprem/proxmox.yaml

host_key_checking = False
interpreter_python = auto_silent
# 실패한 호스트만 다시 돌릴 수 있게 남긴다.
retry_files_enabled = True
retry_files_save_path = /tmp/ansible-retry
# 출력이 길어지면 어느 태스크가 뭘 바꿨는지 안 보인다.
stdout_callback = yaml
# 컬렉션·모듈의 deprecation 경고를 접는다. 실행마다 화면을 덮어서 정작 봐야 하는
# 태스크 결과가 위로 밀려난다.
# (Proxmox 자체서명 인증서 쪽 urllib3 경고는 이게 아니라
#  scripts/cantaloupe-env.sh 의 PYTHONWARNINGS 가 막는다)
deprecation_warnings = False

[inventory]
# 인벤토리 파싱 실패를 경고가 아니라 에러로 만든다.
# 안 그러면 "0 hosts matched" 로 조용히 성공한다 — 이 프로젝트가 반복해 밟은 함정이다.
unparsed_is_failed = True

[ssh_connection]
# sudo를 사용하는 여러 태스크가 같은 SSH 연결을 재사용한다.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
