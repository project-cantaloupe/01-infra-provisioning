---
collections:
  # EC2 태그를 읽어 동적으로 platform/role 그룹을 만든다.
  - name: amazon.aws
    version: "11.4.0"

  # 온프렘 인벤토리(community.general.proxmox)와 common 롤의 modprobe 모듈이 쓴다.
  # 없으면 "couldn't resolve module/action 'community.general.modprobe'" 로 죽는다.
  - name: community.general
    version: "11.3.0"

  # GCP 인스턴스 라벨을 읽어 platform/role 그룹을 만든다
  # (inventories/gcp/gcp_compute.yaml).
  #
  # **이 컬렉션만으로는 안 돈다.** 플러그인이 google-auth 와 requests 를
  # 시스템 파이썬에서 import 하므로 apt 로 python3-google-auth 도 있어야 한다
  # (scripts/bootstrap-workstation.sh 가 깐다). 없으면 "Ansible is using the
  # wrong Python interpreter" 로 죽는데 인터프리터 문제가 아니라 그 인터프리터에
  # 라이브러리가 없는 것이다.
  - name: google.cloud
    version: "1.3.0"

  # 온프렘 group_vars 가 tailnet auth key 를 Vault 에서 읽는다
  # (inventories/onp/group_vars/platform_onp.yml).
  # 없으면 "lookup plugin (community.hashi_vault.vault_kv2_get) not found" 로
  # 죽는데, 그 에러는 Vault 쪽 문제로 읽히기 쉽다 — 컬렉션이 없는 것뿐이다.
  - name: community.hashi_vault
    version: "6.1.0"
