---
# Tailscale 에이전트 설치 + tailnet 조인.
#
# auth key 는 절대 코드나 로그에 남기지 않는다. no_log 를 건 이유가 그것이다.
# 키가 유출되면 남이 우리 tailnet 에 노드를 붙일 수 있다.

- name: Ubuntu 노드인지 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: 현재 Tailscale 설치 역할은 Ubuntu만 지원합니다.

- name: Tailscale 저장소에 필요한 패키지 설치
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: tailscale_manage_packages | bool

- name: Tailscale 패키지 서명 키 설치
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/ubuntu/{{
      ansible_facts.distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  when: tailscale_manage_packages | bool

- name: Tailscale APT 저장소 추가
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu
      {{ ansible_facts.distribution_release }} main
    filename: tailscale
    state: present
    update_cache: true
  when: tailscale_manage_packages | bool

# cache_valid_time 이 있어야 바로 위 apt_repository 가 이미 돌린 apt-get update 를
# 한 번 더 돌리지 않는다 (apt_repository 의 update_cache 기본값이 yes 다).
- name: Tailscale 설치
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: tailscale_manage_packages | bool

- name: tailscaled 서비스 활성화
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# ── 가입 상태 판정 ────────────────────────────────────────────
#
# `tailscale ip -4` 만 보지 않는다. 로그아웃 직후처럼 IP 가 남아 있는데
# BackendState 는 Running 이 아닌 구간이 있다. 상태를 직접 본다.
- name: 현재 tailnet 상태 조회
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: 현재 BackendState 파싱
  ansible.builtin.set_fact:
    tailscale_backend_before: >-
      {{ (tailscale_status_before.stdout | from_json).BackendState | default('Unknown')
         if tailscale_status_before.rc == 0 else 'Unknown' }}

- name: 미가입 노드에 사용할 Tailscale 인증 키 확인
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: |
      노드가 tailnet 에 가입되어 있지 않은데 인증 키가 비어 있습니다.
      Tailscale admin 콘솔 → Settings → Keys 에서 발급한 뒤:
        CNTLP_TAILSCALE_AUTH_KEY=tskey-auth-xxxx ansible-playbook ...
      재사용 가능(reusable) + 태그 부여 권한이 있는 키여야 합니다.
      노드용은 ephemeral 로 발급하는 것을 권합니다 — defaults/main.yml 참고.
  when: tailscale_backend_before != 'Running'

# 키와 같은 이유로 여기서 막는다. 태그가 비었거나 tailnet 에 없는 값이면
# `tailscale up` 이 "requested tags ... are invalid or not permitted" 로 죽는데,
# 그 출력은 no_log 에 가려서 원인이 안 보인다. 미리 형태만이라도 검사한다.
#
# **형태만 본다.** 그 태그가 tailnet 에 실제로 있는지는 여기서 알 수 없다 —
# 확인하려면 Tailscale API 키가 필요하고, 그건 이 롤이 없애려는 secret-zero 를
# 하나 늘리는 일이다. 실재 여부는 admin 콘솔의 tagOwners 로 확인한다.
- name: 미가입 노드에 사용할 tailnet 태그 확인
  ansible.builtin.assert:
    that:
      - tailscale_tags | length > 0
      - tailscale_tags is match('^tag:[a-z0-9-]+(,tag:[a-z0-9-]+)*$')
    fail_msg: |
      tailscale_tags 가 비었거나 형식이 잘못됐습니다: "{{ tailscale_tags }}"

      이 롤은 기본값을 두지 않습니다. 노드 종류마다 태그가 다르고,
      틀린 태그로 가입하면 노드가 뜬 채 ACL 에 막혀 고립되기 때문입니다.

      호출하는 쪽에서 지정하세요 — 지금 쓰는 값:
        tag:cntlp-aws-cp   컨트롤플레인
        tag:cntlp-wk       워커 (aws · gcp · onp)
        tag:cntlp-vault    Vault

      태그는 Tailscale admin → Access controls 의 tagOwners 에 있어야 하고,
      인증 키에도 그 태그의 부여 권한이 붙어 있어야 합니다.
  when: tailscale_backend_before != 'Running'

- name: 미가입 노드를 tailnet 에 등록
  when: tailscale_backend_before != 'Running'
  block:
    - name: Tailscale 인증 키 임시 배치
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: "{{ tailscale_auth_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # --accept-dns 는 tailscale_accept_dns 가 정한다 — defaults/main.yml 참고.
    #
    # --advertise-routes 는 값이 있을 때만 붙인다. 빈 문자열로 넘기면
    # 기존에 광고 중이던 경로를 지워버린다.
    - name: 인증 키 파일로 tailnet 가입
      ansible.builtin.command:
        argv: >-
          {{ ['tailscale', 'up',
              '--auth-key=file:' ~ tailscale_auth_key_path,
              '--hostname=' ~ tailscale_hostname,
              '--advertise-tags=' ~ tailscale_tags,
              '--accept-dns=' ~ (tailscale_accept_dns | bool | lower),
              '--accept-routes=' ~ (tailscale_accept_routes | bool | lower),
              '--timeout=2m']
             + (['--ssh'] if tailscale_ssh | bool else [])
             + (['--advertise-routes=' ~ (tailscale_advertise_routes | join(','))]
                if tailscale_advertise_routes | length > 0 else [])
             + ['--reset'] }}
      changed_when: true
      no_log: true
  always:
    - name: Tailscale 인증 키 임시 파일 제거
      ansible.builtin.file:
        path: "{{ tailscale_auth_key_path }}"
        state: absent
      no_log: true

# ── 가입 뒤에도 수렴시켜야 하는 설정 ──────────────────────────
#
# `tailscale up` 은 미가입일 때만 돈다. 이미 Running 인 노드는 위 블록을
# 통째로 건너뛰므로, up 의 인자로만 설정하면 **값을 바꿔도 반영되지 않는다.**
# 플레이북은 성공하고 노드만 옛 설정으로 남는다.
#
# `tailscale set` 은 가입 상태와 무관하게 먹으므로 여기서 매번 맞춘다.
- name: 현재 MagicDNS 설정 조회
  ansible.builtin.command: tailscale debug prefs
  register: _ts_prefs
  changed_when: false
  check_mode: false

- name: MagicDNS 설정을 맞춘다
  ansible.builtin.command:
    cmd: tailscale set --accept-dns={{ tailscale_accept_dns | bool | lower }}
  when: (_ts_prefs.stdout | from_json).CorpDNS | default(false) | bool
        != (tailscale_accept_dns | bool)
  changed_when: true

# 광고 경로도 같은 이유로 여기 있다. `up` 인자로만 두면 두 겹으로 막힌다.
#
#   1. 위의 `tailscale up` 블록은 미가입 노드에서만 돈다. 이미 붙은 노드는
#      통째로 건너뛰므로 변수를 바꿔도 아무 일도 안 일어난다
#   2. 그 `up` 에는 `--reset` 이 붙어 있다. --reset 은 인자로 주지 않은
#      preference 를 기본값으로 되돌리므로, 손으로 광고해둔 경로가 재조인마다
#      지워진다
#
# 그래서 `--advertise-routes` 는 `tailscale set` 으로 매번 수렴시킨다.
#
# ── 알아둘 것 둘 ────────────────────────────────────────────────
#
# **광고는 승인이 있어야 실제로 산다.** tailnet admin 콘솔에서 경로를 승인하거나
# ACL 에 autoApprovers 를 걸어야 다른 노드가 이 경로를 받는다. 승인 전에는
# `tailscale status` 에 광고만 뜨고 트래픽은 안 온다 — 실패로 안 보인다.
#
# **서브넷 라우터는 들어온 트래픽을 자기 IP 로 SNAT 한다**(--snat-subnet-routes
# 기본값 true). 그래서 워크스테이션 → 파드 트래픽이 파드에는 **라우터 노드의
# tailnet IP** 에서 온 것으로 보인다. 파드가 아니라 호스트라서 파드 셀렉터로는
# 허용되지 않는다 — 02-k8s-manifests 의 default-deny-ingress 가 켜지면 ipBlock
# 규칙이 따로 필요하다 → tasks/todo/002_bootstrap-blockers.md 2번
- name: 광고 경로를 맞춘다
  ansible.builtin.command:
    cmd: >-
      tailscale set
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
  when: ((_ts_prefs.stdout | from_json).AdvertiseRoutes | default([], true) | sort)
        != (tailscale_advertise_routes | sort)
  changed_when: true

# 경로 수신도 같은 이유로 여기 있다. 그리고 여기 있어야 하는 이유가 하나 더 있다.
#
# **이 값은 여태 코드에 없었다.** "롤이 --accept-routes 를 안 넘기니 기본값으로
# 꺼져 있을 것"이라고 주석에만 적혀 있었는데, 실측하니 컨트롤플레인과 온프렘
# 워커가 둘 다 켜져 있었다. 손으로 켠 것을 되돌리는 코드가 없으면 드리프트가
# 영구히 남는다 — 플레이북은 매번 성공하고 노드만 틀린 채로 있다.
#
# 켜져 있으면 무슨 일이 나는지는 defaults/main.yml 주석에 있다. 요지는 받은
# 경로가 ip rule 5270 으로 들어와 Calico 의 main(32766)을 앞지른다는 것이다.
#
# prefs 의 키 이름이 플래그와 다르다 — `--accept-routes` 는 `RouteAll` 로 뜬다.
- name: 경로 수신 설정을 맞춘다
  ansible.builtin.command:
    cmd: >-
      tailscale set
      --accept-routes={{ tailscale_accept_routes | bool | lower }}
  when: ((_ts_prefs.stdout | from_json).RouteAll | default(false, true) | bool)
        != (tailscale_accept_routes | bool)
  changed_when: true

# Tailscale SSH 도 정확히 같은 함정이었다. `--ssh` 가 위 `tailscale up` 인자로만
# 있어서, 이미 가입한 노드에는 `tailscale_ssh` 를 바꿔도 영원히 반영되지 않는다.
#
# **그래서 실물이 갈라져 있었다** (2026-08-04 실측, prefs 직접 조회):
#
#   RunSSH=true    cntlp-aws-cp-01 · cntlp-onp-wk-01
#   RunSSH=false   cntlp-gcp-wk-01 · cntlp-gcp-wk-02 · cntlp-aws-wk-01
#
# 롤의 기본값은 `tailscale_ssh: true` 인데도 5대 중 2대만 켜져 있었다. 꺼진
# 3대는 `--ssh` 가 없던 시절에 가입한 노드다. 그 결과가 **접근 경로가 노드마다
# 다른 상태**였다 — GCP 2대는 아예 못 들어가고, aws-wk-01 은 접속할 때마다
# EC2 Instance Connect 로 60초짜리 키를 밀어야 했다.
# → tasks/todo/009_node-access-paths.md
#
# ACL 은 이미 허용하고 있었다. `cntlp-onp-wk-01` 이 같은 `tag:cntlp-wk` 로
# 키 없이 접속되는 것이 그 증거다. 막고 있던 것은 노드의 이 pref 하나였다.
- name: SSH 설정을 맞춘다
  ansible.builtin.command:
    cmd: >-
      tailscale set
      --ssh={{ tailscale_ssh | bool | lower }}
  when: ((_ts_prefs.stdout | from_json).RunSSH | default(false, true) | bool)
        != (tailscale_ssh | bool)
  changed_when: true

# ── 결과 검증 ─────────────────────────────────────────────────

- name: 가입 결과 조회
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_after
  changed_when: false
  check_mode: false

- name: tailnet IP·상태·등록 이름 추출
  ansible.builtin.set_fact:
    tailscale_ipv4: "{{ (tailscale_status_after.stdout | from_json).Self.TailscaleIPs
                        | select('match', '^100\\.') | first | default('') }}"
    tailscale_backend: "{{ (tailscale_status_after.stdout | from_json).BackendState }}"
    # DNSName 은 "<이름>.<tailnet>.ts.net." 이다. 첫 라벨이 실제로 등록된 이름이다.
    tailscale_registered_name: >-
      {{ ((tailscale_status_after.stdout | from_json).Self.DNSName | default('')).split('.')
         | first | default('') }}

- name: 실제로 붙었는지 검사
  ansible.builtin.assert:
    that:
      - tailscale_backend == 'Running'
      - tailscale_ipv4 | length > 0
      - tailscale_ipv4 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: >-
      tailnet 조인에 실패했다. BackendState={{ tailscale_backend }},
      IP={{ tailscale_ipv4 }}. auth key 가 만료됐거나 태그 부여 권한이 없을 수 있다.
    success_msg: "tailnet 조인 완료 — {{ tailscale_hostname }} = {{ tailscale_ipv4 }}"

# ── VM 을 다시 만들었을 때 조용히 틀어지는 지점 ────────────────
#
# **VM 을 지워도 tailnet 의 디바이스는 남는다.** 새 VM 은 machine key 가 새것이라
# Tailscale 이 같은 이름의 디바이스를 하나 더 만들고, 이름이 겹치므로 뒤에
# `-1` 을 붙인다. 그러면 이 노드의 메시 이름과 IP 가 이전과 달라진다.
#
# 이게 조용히 지나가면 kubeadm join 의 --node-ip 가 바뀌고, 죽은 디바이스에
# 남은 --advertise-routes 와 겹쳐 라우팅이 흔들린다. 그래서 여기서 멈춘다.
#
# 근본 해결은 노드용 auth key 를 **ephemeral** 로 발급하는 것이다 —
# 오프라인이 되면 Tailscale 이 디바이스를 스스로 지운다. defaults/main.yml 참고.
- name: tailnet 이 이름을 바꿔 등록하지 않았는지 검사
  ansible.builtin.assert:
    that: tailscale_registered_name == tailscale_hostname
    fail_msg: |
      tailnet 에 등록된 이름이 노드 이름과 다르다.
        등록됨 : {{ tailscale_registered_name }}
        기대   : {{ tailscale_hostname }}

      같은 이름의 죽은 디바이스가 tailnet 에 남아 있어 Tailscale 이 접미사를
      붙인 것이다. VM 을 다시 만들 때 생긴다.

      Tailscale admin 콘솔에서 오프라인 디바이스 `{{ tailscale_hostname }}` 를
      지운 뒤 이 롤을 다시 돌린다. 반복될 일이면 auth key 를 ephemeral 로
      발급한다 — references/20260801_infra-07-onp-vm-recreate.md 참고.
    success_msg: "tailnet 이름 확인 — {{ tailscale_registered_name }}"

# kubeadm join/init 이 이 주소를 --node-ip 로 쓴다. 영역 간 통신이 메시를 타야
# 하므로 노드 IP 가 LAN 주소(192.168.x)면 다른 영역에서 못 닿는다.
- name: 이후 Kubernetes 역할에서 사용할 Tailscale IPv4 안내
  ansible.builtin.debug:
    msg: "이 노드의 메시 IP = {{ tailscale_ipv4 }} (kubeadm --node-ip 로 쓴다)"
