---
# GCP 노드의 그룹 변수 (labels.platform=gcp 가 만드는 platform_gcp 그룹).

# Ubuntu 이미지의 기본 계정이다 (ubuntu-2404-lts-amd64).
ansible_user: ubuntu
ansible_python_interpreter: /usr/bin/python3

# **개인키를 지정하지 않는다. Tailscale SSH 로 들어간다.**
#
# GCP 워커는 외부 IP 가 없고 IAP 방화벽 규칙만 열려 있어서, gcloud 없이는
# 22 번에 닿을 방법이 메시뿐이다. 그런데 메시에 붙어 있어도 여태 못 들어갔다 —
# 노드의 `RunSSH` pref 가 꺼져 있었기 때문이다 (2026-08-04 실측).
# `/home/ubuntu/.ssh/authorized_keys` 도 0 줄이었다.
#
# 키를 심는 대신 pref 를 켜는 쪽을 골랐다. 그게 롤의 기본값이고
# (roles/vpn-mesh/defaults/main.yml 의 tailscale_ssh), tailnet ACL 이 이미
# 같은 태그를 허용하고 있었다 — cntlp-onp-wk-01 이 같은 tag:cntlp-wk 로 키 없이
# 들어가지는 것이 증거다. 키를 심으면 벗어나려던 키 산개가 하나 더 늘 뿐이다.
# → tasks/todo/009_node-access-paths.md, decisions/20260731_secret-access-no-fallback.md
#
# 이제 그 pref 는 롤이 매번 수렴시킨다 (roles/vpn-mesh/tasks/main.yml
# 「SSH 설정을 맞춘다」). 손으로 켠 것이 재조인 때 --reset 으로 날아가지 않는다.

# Tailscale SSH 는 tailscaled 가 세션마다 호스트 키를 내므로 워크스테이션의
# known_hosts 와 어긋난다. 노드를 다시 만들면 또 바뀐다.
ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'

# ufw 를 켜도 GCP 콘솔·IAP 로 들어올 길을 남긴다.
#
# terraform/gcp/main.tf 의 allow_iap_ssh 가 VPC 방화벽에서 이미 이 대역을
# 열어두는데, 호스트 ufw 는 그걸 모른다. 롤의 기본 allow-list 는 사설 대역과
# tailnet 뿐이라, ufw 를 켜는 순간 **메시가 유일한 경로가 된다.**
#
# 그게 왜 위험한지는 2026-08-04 에 실측했다. Cloud NAT 외부 IP 가 갈리면서
# GCP 워커 2대가 tailnet 에서 동시에 떨어졌고, 그때 노드 안을 볼 수 있는
# 유일한 수단이 콘솔이었다. 마침 그 노드들은 ufw 가 꺼져 있었다.
# 010 이 5대에 ufw 를 켤 예정이므로, 그 전에 이 줄이 있어야 한다.
#
# 35.235.240.0/20 은 Google 이 고정 공시하는 IAP TCP forwarding 대역이다.
security_ssh_allow_from_extra:
  - 35.235.240.0/20

# **인벤토리 플러그인 자체는 GCP 자격증명이 필요하다.** 접속은 메시로 하지만
# 호스트 목록은 GCP API 에서 온다. GCP_SERVICE_ACCOUNT_FILE 과 GCP_PROJECT 가
# 없으면 gcp_compute.yaml 파싱이 실패하고, ansible.cfg 의 unparsed_is_failed
# 때문에 (의도대로) 조용한 0 hosts 대신 에러로 죽는다.

# tailnet 태그 — roles/vpn-mesh/defaults/main.yml 참고. 롤에는 기본값이 없다.
# GCP 호스트는 전부 워커다. 워커는 플랫폼과 무관하게 한 태그를 쓰고,
# 실행 위치는 platform 라벨이 가른다.
tailscale_tags: "tag:cntlp-wk"

# 실제 Compute Engine API 응답을 사용한다. Terraform 코드에 machine type을
# 중복 기입하지 않아 콘솔 변경이나 기존 드리프트를 잘못된 라벨로 숨기지 않는다.
kubernetes_node_platform: gcp
kubernetes_node_region: >-
  {{ (gcp_zone | regex_replace('^.*/', '')) | regex_replace('-[a-z]$', '') }}
kubernetes_node_instance_type: "{{ gcp_machineType | regex_replace('^.*/', '') }}"
kubernetes_node_provider_id: >-
  gce://{{ lookup('env', 'GCP_PROJECT') }}/{{ gcp_zone | regex_replace('^.*/', '') }}/{{ gcp_name }}
