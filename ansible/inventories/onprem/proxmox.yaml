# telmate/proxmox 가 아니라 bpg/proxmox 를 쓴다 (telmate 는 방치 상태).
plugin: community.general.proxmox
url: "{{ lookup('env', 'PROXMOX_URL') }}"
user: "{{ lookup('env', 'PROXMOX_USER') }}"
token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"

# Proxmox 는 자체서명 인증서를 쓴다. 켜두면 CERTIFICATE_VERIFY_FAILED 로 막힌다.
# terraform provider 쪽 proxmox_insecure 와 같은 이유다.
validate_certs: false

# qemu-guest-agent 가 보고하는 IP 로 ansible_host 를 채우려면 필요하다.
want_facts: true

# 이 플러그인은 ansible_host 를 스스로 채우지 않는다. 비워두면 ansible 이
# VM 이름으로 접속을 시도하고, 그 이름은 DNS 에 없으므로 UNREACHABLE 이 된다.
#
# IP 는 proxmox_agent_interfaces 에 들어온다 — **qemu-guest-agent 가 떠 있어야 한다.**
# (cloud-init 이 설치한다. terraform/onprem/cloud-init/worker.yaml.tftpl 참고)
# lo 를 빼고 첫 IPv4 를 골라 CIDR 접미사를 떼어낸다.
# ipconfig0 를 쓰지 않는 이유는 그쪽이 고정 IP 일 때만 값이 있기 때문이다.
compose:
  ansible_host: >-
    (proxmox_agent_interfaces | default([]))
    | rejectattr("name", "eq", "lo")
    | map(attribute="ip-addresses") | flatten
    | select("match", "^[0-9]{1,3}[.]") | map("regex_replace", "/.*$", "")
    | first | default(proxmox_name)

# Terraform 이 붙인 태그가 그대로 Ansible 그룹이 된다 — aws_ec2.yaml, gcp_compute.yaml 과 같은 규칙.
#
# 다만 Proxmox 태그는 key=value 를 못 쓴다. 평평한 문자열 목록이라
# `area-onprem`, `role-worker` 처럼 붙여 놓고 여기서 접두사를 떼어낸다.
#   proxmox_tags_parsed = ["area-onprem", "role-worker"]
#     → area_onprem, role_worker
#
# **이 블록이 없으면 role_worker 그룹이 안 생긴다.** 그러면 site-workers.yaml 이
# 에러 없이 "0 hosts matched" 로 조용히 끝난다 — 실패로 안 보여서 알아채기 어렵다.
keyed_groups:
  - key: proxmox_tags_parsed | select('match', '^area-') | map('replace', 'area-', '') | first | default('none')
    prefix: area
  - key: proxmox_tags_parsed | select('match', '^role-') | map('replace', 'role-', '') | first | default('none')
    prefix: role
