---
# Tailscale SaaS 를 쓴다 (decisions/20260728_network-connectivity-and-access,
# 2026-07-29 변경). headscale 을 자체호스팅하지 않는다.

# 사전 준비 플레이에서는 패키지를 관리하고 후속 플레이에서는 상태만 재확인한다.
tailscale_manage_packages: true

# tailnet auth key. **절대 여기 적지 않는다.** 실행 환경에서 받는다:
#   CNTLP_TAILSCALE_AUTH_KEY=tskey-auth-... ansible-playbook ...
#
# **ephemeral 키로 발급하는 것을 권한다.** VM 을 지우면 tailnet 의 디바이스는
# 남는데, 새 VM 은 machine key 가 새것이라 같은 이름의 디바이스가 하나 더 생기고
# Tailscale 이 뒤에 `-1` 을 붙인다. 그러면 메시 이름과 IP 가 이전과 달라져
# kubeadm 의 --node-ip 가 바뀐다. ephemeral 키로 등록된 디바이스는 오프라인이
# 되면 Tailscale 이 스스로 지우므로 이 문제가 생기지 않는다.
# (tasks/main.yml 이 이름이 바뀌었는지 검사해서 조용히 지나가지는 않는다)
tailscale_auth_key: >-
  {{
    lookup('env', 'CNTLP_TAILSCALE_AUTH_KEY')
    | default('', true)
  }}

# 키를 명령줄 인자로 넘기지 않고 0600 파일로 넘긴다. argv 는 /proc 에서 읽힌다.
tailscale_auth_key_path: /run/cntlp-tailscale-auth-key
tailscale_hostname: "{{ ansible_facts.hostname }}"

# 노드에 붙일 tailnet 태그. ACL 이 이걸로 접근을 가른다.
#
# **기본값을 두지 않는다.** 호출하는 쪽이 반드시 정해야 한다 (tasks/main.yml 이
# assert 로 검사한다). 한때 `tag:k8s-node` 가 기본값이었는데 이 tailnet 에
# 없는 태그였다 — tagOwners 에도 acls 에도 없어서 `tailscale up` 이
# `requested tags [tag:k8s-node] are invalid or not permitted` 로 죽는다.
# 있지도 않은 값이 기본값으로 앉아 있으면 롤이 어느 노드에서도 성공하지 못한다.
#
# 그리고 태그는 노드 종류마다 다르다. 하나를 기본값으로 고르면 나머지가 전부
# 틀린다. ACL 이 태그로 접근을 가르므로 틀린 태그로 가입하면 노드가 뜬 채
# 고립되고, `tailscale up` 자체는 성공해서 실패로 보이지 않는다.
#
# 지금 쓰는 값 (2026-07-31 기준 tailnet 실측):
#   tag:cntlp-aws-cp   컨트롤플레인   inventories/aws/group_vars/role_control_plane.yml
#   tag:cntlp-wk       워커 (전 플랫폼) inventories/{aws,gcp,onp}/group_vars/...
#   tag:cntlp-vault    Vault          playbooks/site-vault.yaml
tailscale_tags: ""

# 서브넷 라우터로 광고할 대역. 단일 클러스터라 노드 IP 도달성만으로는 부족하고
# 파드 CIDR 까지 라우팅돼야 한다 (decisions/20260728_network-connectivity-and-access).
#
# **기본은 비어 있다 — 광고하는 노드에서만 켠다.** 지금은 컨트롤플레인이 켠다
# (inventories/aws/group_vars/role_control_plane.yml). 왜 하필 그 그룹인지는
# 그쪽 주석에 있다 — 다른 후보는 Vault 나 다른 영역까지 샌다.
#
# 값을 바꾸면 가입 상태와 무관하게 반영된다. tasks/main.yml 의 수렴 구간이
# `tailscale set` 으로 매번 맞춘다 — `up` 인자로만 두면 안 되는 이유가
# 거기 적혀 있다.
tailscale_advertise_routes: []

# tailnet 이 광고하는 서브넷 경로를 **받을지**. 위 광고와 방향이 반대다.
#
# **클러스터 노드에서는 반드시 꺼둔다.** 받은 경로는 라우팅 테이블 52 로 들어가고
# 그 룩업이 `ip rule` 우선순위 **5270** 이다 — Calico 가 쓰는 main(32766)보다
# 앞이다. 파드 CIDR 이 승인되는 순간 노드가 파드 대역을 tailnet 쪽으로 보내기
# 시작하고, 그게 곧 Tailscale ↔ Calico VXLAN 재귀 루프다.
# → findings/20260803_tailscale-calico-vxlan-loop.md
#
# **사람 기기는 반대로 켜야 한다.** 워크스테이션에서 파드 IP 로 가려면 경로를
# 받아야 한다. 그 설정은 이 롤 밖이다 — 노드만 여기서 관리한다.
#
# 여태 이 값은 **주석으로만 존재했다.** 롤이 플래그를 안 넘기니 기본값(꺼짐)으로
# 남을 것이라 적어뒀는데, 실물은 컨트롤플레인·온프렘 워커 모두 켜져 있었다.
# 누가 손으로 켜면 되돌릴 것이 없었기 때문이다. 그래서 값으로 만들어 수렴시킨다.
tailscale_accept_routes: false

# SSH 를 tailnet 으로도 받을지. tailnet 정책에서 허용한 사용자만 들어온다.
tailscale_ssh: true

# MagicDNS 를 받을지. 기본은 끔 — MagicDNS 가 /etc/resolv.conf 를 갈아치우면
# 클러스터 DNS(CoreDNS)와 충돌한다. K8s 노드는 클러스터 DNS 를 봐야 한다.
#
# **K8s 노드가 아니면 켜는 편이 낫다.** 끄면 노드가 자기 tailnet 이름조차
# 해석하지 못한다. tailnet 이름으로 자기 API 를 확인하는 롤(vault-server 의
# seal 상태 검증)이 `No address associated with hostname` 으로 죽는다.
# 밖에서 보면 멀쩡한데 — 워크스테이션은 MagicDNS 가 켜져 있어 잘 푼다 —
# 노드 안에서만 안 되는 형태라 원인을 찾기 어렵다.
tailscale_accept_dns: false
