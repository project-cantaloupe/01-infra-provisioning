---
# Control Plane과 Worker에 동일하게 필요한 OS 및 런타임 준비만 수행한다.
# Tailscale 가입까지 수행하지만 kubeadm init/join은 다음 플레이북이 담당한다.
- name: Kubernetes 노드 사전 준비
  hosts: role_control_plane:role_worker
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cluster.yml
  roles:
    - common
    - vpn-mesh
    - containerd
    - kubeadm-common
