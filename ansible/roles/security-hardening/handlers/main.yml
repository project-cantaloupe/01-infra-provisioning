---
- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: reload ufw
  community.general.ufw:
    state: reloaded

# 유닛 파일이 바뀌면 규칙을 다시 넣는다. ExecStop 이 옛 규칙을 지우고
# ExecStart 가 새것을 넣으므로 restart 한 번이면 대역·우선순위 변경까지 따라간다.
- name: restart loop guard rule
  ansible.builtin.systemd_service:
    name: cntlp-tailscale-calico-guard.service
    daemon_reload: true
    state: restarted
