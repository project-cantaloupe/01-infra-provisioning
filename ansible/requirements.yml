---
collections:
  # EC2 태그를 읽어 동적으로 platform/role 그룹을 만든다.
  - name: amazon.aws
    version: "11.4.0"

  # 온프렘 인벤토리(community.general.proxmox)와 common 롤의 modprobe 모듈이 쓴다.
  # 없으면 "couldn't resolve module/action 'community.general.modprobe'" 로 죽는다.
  - name: community.general
    version: "11.3.0"

  # 온프렘 group_vars 가 tailnet auth key 를 Vault 에서 읽는다
  # (inventories/onp/group_vars/platform_onp.yml).
  # 없으면 "lookup plugin (community.hashi_vault.vault_kv2_get) not found" 로
  # 죽는데, 그 에러는 Vault 쪽 문제로 읽히기 쉽다 — 컬렉션이 없는 것뿐이다.
  - name: community.hashi_vault
    version: "6.1.0"
