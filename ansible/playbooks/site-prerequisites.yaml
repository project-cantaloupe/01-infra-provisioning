---
# Control Plane과 Worker에 동일하게 필요한 OS 및 런타임 준비만 수행한다.
# Tailscale 가입까지 수행하지만 kubeadm init/join은 다음 플레이북이 담당한다.
#
# hosts 패턴은 site-workers.yaml 과 같은 이유로 platform 그룹을 쓴다.
# 팀 협약의 role 값에는 worker 가 없고(control-plane | service | devops | ...),
# Proxmox 인벤토리는 하이퍼바이저 자신(`pve`)도 호스트로 노출한다 —
# decisions/20260729_k8s-labeling-convention.
#
# ── 태그 ────────────────────────────────────────────────────────
#   os     common + security-hardening + containerd + kubeadm-common — 외부 의존 없음
#   mesh   vpn-mesh — 미가입 노드일 때 인증 키 필요
#
# **role_secrets 를 뺀다.** Vault 노드(cntlp-aws-vault-01)도 platform=aws 태그를
# 갖기 때문에 platform_aws 그룹에 들어온다. 빼지 않으면 K8s 노드가 아닌 곳에
# containerd 와 kubeadm-common 이 깔린다 — 에러 없이 성공해서 알아채기 어렵다.
# Vault 노드는 playbooks/site-vault.yaml 이 담당한다.
- name: Kubernetes 노드 사전 준비
  hosts: platform_aws:platform_gcp:platform_onp:!role_secrets
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cluster.yml
  roles:
    - role: common
      tags: [os, common]
    - role: security-hardening
      tags: [os, security]
    - role: vpn-mesh
      tags: [mesh]
    - role: containerd
      tags: [os, containerd]
    - role: kubeadm-common
      tags: [os, kubeadm]
